<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیدولي خان کوهستاني بوک</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
    color:#1c1e21;
    min-height:100vh;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN & FACEBOOK STYLE FIRST PAGE ================= */
#auth-view{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.auth-container{
    width:100%;
    max-width:1000px;
    display:flex;
    gap:50px;
    align-items:center;
    justify-content:center;
}

.auth-left{
    flex:1;
    max-width:500px;
}

.auth-left h1{
    color:#1877f2;
    font-size:60px;
    font-weight:900;
    margin-bottom:15px;
}

.auth-left p{
    font-size:24px;
    font-weight:bold;
    line-height:1.6;
}

.auth-card{
    width:100%;
    max-width:400px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #dddfe2;
    border-radius:7px;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:#1877f2;
    box-shadow:0 0 0 2px #e7f3ff;
}

.btn-login{
    width:100%;
    border:0;
    padding:13px;
    border-radius:7px;
    background:#1877f2;
    color:white;
    font-size:19px;
    font-weight:bold;
}

.btn-login:hover{
    background:#166fe5;
}

.btn-register{
    border:0;
    padding:12px 20px;
    border-radius:7px;
    background:#42b72a;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.btn-register:hover{
    background:#36a420;
}

.divider{
    height:1px;
    background:#dadde1;
    margin:20px 0;
}

.error{
    display:none;
    color:#d93025;
    background:#fff1f0;
    border:1px solid #ffd2cf;
    padding:10px;
    border-radius:6px;
    margin-bottom:12px;
    text-align:center;
    font-weight:bold;
}

/* ================= REGISTER MODAL (FIXED VIEW) ================= */
.modal{
    display:none; 
    position:fixed;
    inset:0;
    background:rgba(255, 255, 255, 0.9);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:10px;
    padding:22px;
    position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
    border: 1px solid #ccd0d5;
}

.close{
    position:absolute;
    left:15px;
    top:10px;
    font-size:28px;
    color:#606770;
    cursor:pointer;
    font-weight: bold;
}

.modal-box h2{
    font-size:32px;
    font-weight: 800;
    margin-bottom:5px;
}

.modal-box p{
    color:#606770;
    font-size: 15px;
    margin-bottom:20px;
    border-bottom: 1px solid #dadde1;
    padding-bottom: 10px;
}

/* ================= MAIN APPLICATION VIEW ================= */
#main-view{
    display:none;
}

.navbar{
    background:white;
    border-bottom:1px solid #dddfe2;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.nav-logo h2{
    color:#1877f2;
    font-size:24px;
    font-weight: bold;
}

.nav-center-tabs {
    display: flex;
    gap: 15px;
}

.fb-tab-btn {
    background: #f0f2f5;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    color: #65676b;
    font-size: 15px;
}

.fb-tab-btn.active {
    background: #e7f3ff;
    color: #1877f2;
}

.nav-user{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-name{
    font-weight:bold;
}

.btn-logout{
    border:0;
    background:#f02849;
    color:white;
    padding:8px 14px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:1100px;
    margin:20px auto;
    padding:0 15px;
}

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

/* ================= STORIES & FEED ================= */
.fb-stories-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.fb-story-card {
    width: 100px;
    height: 150px;
    background: #e4e6eb;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
    font-weight: bold;
    font-size: 12px;
    color: #050505;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.app-section {
    display: none;
}

.app-section.active {
    display: block;
}

.card{
    background:white;
    border:1px solid #dddfe2;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.06);
}

.post-create{
    padding:15px;
    margin-bottom:15px;
}

.post-create textarea{
    width:100%;
    min-height:100px;
    resize:none;
    border:1px solid #dddfe2;
    border-radius:8px;
    padding:12px;
    font-size:16px;
    outline:none;
}

.btn-post{
    background:#1877f2;
    color:white;
    border:0;
    padding:10px 25px;
    border-radius:7px;
    font-weight:bold;
    margin-top: 10px;
}

.post{
    padding:18px;
    margin-bottom:15px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.post-user{
    font-weight:bold;
    font-size:17px;
}

.post-content{
    font-size:17px;
    line-height:1.7;
    margin-bottom:15px;
}

/* ================= CHAT BOX ================= */
.side-card{
    padding:15px;
    margin-bottom:15px;
}

.side-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.user-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border-radius:7px;
    cursor:pointer;
}

.user-item:hover{
    background:#f0f2f5;
}

.chat-card{
    padding:15px;
    position:sticky;
    top:75px;
}

.chat-box{
    height:300px;
    background:#f0f2f5;
    border-radius:8px;
    padding:10px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.message{
    max-width:80%;
    padding:8px 12px;
    border-radius:17px;
    font-size: 15px;
}

.message.mine{
    background:#1877f2;
    color:white;
    align-self:flex-start;
}

.message.theirs{
    background:#e4e6eb;
    color:#111;
    align-self:flex-end;
}

.chat-form{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.chat-form input{
    flex:1;
    padding:10px;
    border:1px solid #dddfe2;
    border-radius:18px;
}

.chat-form button{
    border:0;
    background:#1877f2;
    color:white;
    border-radius:18px;
    padding:0 15px;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:bold;
    color:#65676b;
}
</style>
</head>
<body>

<!-- د ننوتلو صفحه (Sign In) کټ مټ د فېسبوک په سټایل -->
<div id="auth-view">
    <div class="auth-container">
        <div class="auth-left">
            <h1>افغان بوک</h1>
            <p>د سیدولي خان کوهستاني پرمختللی سیستم؛ احمد او محمود دلته د کلاوډ فلیر ډېټابېس په ذریعه مېسجونه او پوسټونه کوي.</p>
        </div>
        <div class="auth-card">
            <div class="error" id="auth-error"></div>
            <input type="text" id="login-username" class="input" placeholder="کارن نوم (Username)">
            <input type="password" id="login-password" class="input" placeholder="پټ نوم (Password)">
            <button class="btn-login" onclick="handleLogin()">داخلېدل (Sign In)</button>
            <div class="divider"></div>
            <div style="text-align: center;">
                <button class="btn-register" onclick="toggleModal(true)">نوی حساب جوړول (Create Account)</button>
            </div>
        </div>
    </div>
</div>

<!-- د نوي حساب جوړولو (Create Account) ماډل خلاصېدونکی فارم -->
<div class="modal" id="register-modal">
    <div class="modal-box">
        <span class="close" onclick="toggleModal(false)">&times;</span>
        <h2>حساب جوړول</h2>
        <p>دا خورا چټک او اسانه دی.</p>
        <input type="text" id="reg-username" class="input" placeholder="کارن نوم (احمد یا محمود)">
        <input type="email" id="reg-email" class="input" placeholder="بریښنالیک ادرس">
        <input type="password" id="reg-password" class="input" placeholder="نوی پاسورډ">
        <button class="btn-register" style="width: 100%;" onclick="handleRegister()">ثبت نام (Sign Up)</button>
    </div>
</div>

<!-- د ننووتلو وروسته منځپانګه -->
<div id="main-view">
    <div class="navbar">
        <div class="nav-logo"><h2>افغان بوک سسټم</h2></div>
        <div class="nav-center-tabs">
            <button class="fb-tab-btn active" onclick="switchTab('feed-tab', this)">🏠 کور پاڼه</button>
            <button class="fb-tab-btn" onclick="switchTab('groups-tab', this)">👥 ګروپونه</button>
            <button class="fb-tab-btn" onclick="switchTab('events-tab', this)">📅 پېښې</button>
            <button class="fb-tab-btn" onclick="switchTab('market-tab', this)">🛍️ مارکېټ</button>
        </div>
        <div class="nav-user">
            <span class="user-name" id="current-user-display">کارن</span>
            <button class="btn-logout" onclick="handleLogout()">وتل</button>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            <div>
                <div class="fb-stories-bar" id="stories-container-list">
                    <div class="fb-story-card" style="background: #1877f2; color: white;" onclick="createStory()">+ نوې سټوري</div>
                </div>

                <div id="feed-tab" class="app-section active">
                    <div class="card post-create">
                        <textarea id="post-text" placeholder="څه په فکر کې لرئ؟"></textarea>
                        <button class="btn-post" onclick="createPost()">خپرول (Post)</button>
