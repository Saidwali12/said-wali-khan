<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>سیدولي خان کوهستاني بوک</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
    color:#1c1e21;
}

button,input,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#auth-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 15px;
}

.auth-container{
    width:100%;
    max-width:1050px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:60px;
}

.auth-left{
    flex:1;
    max-width:520px;
}

.auth-logo{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:20px;
    border:4px solid white;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    margin-bottom:15px;
}

.auth-left h1{
    color:#1877f2;
    font-size:48px;
    font-weight:900;
    margin-bottom:10px;
}

.auth-left p{
    font-size:25px;
    font-weight:bold;
    line-height:1.5;
}

.auth-right{
    width:400px;
    max-width:100%;
}

.login-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.login-card input,
.modal-content input{
    width:100%;
    padding:15px;
    border:1px solid #dddfe2;
    border-radius:7px;
    margin-bottom:12px;
    font-size:16px;
    outline:none;
}

.login-card input:focus,
.modal-content input:focus{
    border-color:#1877f2;
    box-shadow:0 0 0 2px #e7f3ff;
}

.btn-login{
    width:100%;
    background:#1877f2;
    color:white;
    border:0;
    border-radius:7px;
    padding:13px;
    font-size:20px;
    font-weight:bold;
}

.btn-login:hover{
    background:#166fe5;
}

.divider{
    border-bottom:1px solid #dadde1;
    margin:20px 0;
}

.btn-create{
    display:block;
    margin:auto;
    background:#42b72a;
    color:white;
    border:0;
    border-radius:7px;
    padding:13px 20px;
    font-size:17px;
    font-weight:bold;
}

.error{
    color:#d93025;
    background:#fff0f0;
    border-radius:6px;
    padding:8px;
    text-align:center;
    margin-bottom:10px;
    display:none;
}

.success{
    color:#16803c;
    background:#effaf3;
    border-radius:6px;
    padding:8px;
    text-align:center;
    margin-bottom:10px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:white;
    width:100%;
    max-width:450px;
    border-radius:10px;
    padding:22px;
    position:relative;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.close{
    position:absolute;
    left:15px;
    top:10px;
    font-size:30px;
    color:#606770;
    cursor:pointer;
}

.modal h2{
    font-size:28px;
    margin-bottom:5px;
}

.modal p{
    color:#606770;
    margin-bottom:18px;
}

/* ================= APP ================= */

#main-view{
    display:none;
    min-height:100vh;
}

.topbar{
    height:64px;
    background:#fff;
    border-bottom:1px solid #dddfe2;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.brand{
    color:#1877f2;
    font-size:25px;
    font-weight:900;
}

.top-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.top-user img{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
}

.logout{
    background:#f02849;
    color:white;
    border:0;
    padding:8px 15px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:0 15px;
}

.grid{
    display:grid;
    grid-template-columns:250px minmax(300px,650px) 280px;
    gap:20px;
}

/* SIDEBAR */

.sidebar,
.rightbar{
    background:#fff;
    border:1px solid #dddfe2;
    border-radius:10px;
    padding:15px;
    height:max-content;
}

.sidebar button{
    width:100%;
    border:0;
    background:white;
    padding:12px;
    text-align:right;
    border-radius:7px;
    margin-bottom:5px;
    font-weight:bold;
    font-size:15px;
}

.sidebar button:hover{
    background:#f0f2f5;
}

/* CREATE POST */

.card{
    background:#fff;
    border:1px solid #dddfe2;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
}

.post-input{
    width:100%;
    min-height:90px;
    border:1px solid #dddfe2;
    border-radius:8px;
    padding:12px;
    resize:vertical;
    font-size:16px;
    outline:none;
}

.post-actions{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    gap:10px;
}

.post-actions select{
    padding:8px;
    border:1px solid #dddfe2;
    border-radius:6px;
}

.post-btn{
    background:#1877f2;
    color:white;
    border:0;
    border-radius:6px;
    padding:9px 22px;
    font-weight:bold;
}

/* STORIES */

.story-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:5px;
}

.story{
    min-width:90px;
    height:120px;
    border-radius:10px;
    background:#1877f2;
    color:white;
    padding:8px;
    display:flex;
    align-items:flex-end;
    font-weight:bold;
}

/* POSTS */

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.post-name{
    font-weight:bold;
}

.post-username{
    color:#65676b;
    font-size:13px;
}

.post-content{
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.7;
    margin-bottom:12px;
}

.post-stats{
    display:flex;
    justify-content:space-between;
    color:#65676b;
    font-size:13px;
    padding-bottom:8px;
    border-bottom:1px solid #eee;
}

.post-buttons{
    display:flex;
    margin-top:5px;
}

.post-buttons button{
    flex:1;
    border:0;
    background:white;
    padding:9px;
    font-weight:bold;
    color:#65676b;
    border-radius:6px;
}

.post-buttons button:hover{
    background:#f0f2f5;
}

/* COMMENTS */

.comments{
    margin-top:10px;
}

.comment{
    background:#f0f2f5;
    padding:8px 12px;
    border-radius:15px;
    margin-top:6px;
}

.comment-name{
    font-weight:bold;
    font-size:13px;
}

.comment-input{
    width:100%;
    border:1px solid #dddfe2;
    border-radius:18px;
    padding:9px 14px;
    margin-top:8px;
    outline:none;
}

/* RIGHT */

.online-title{
    font-weight:bold;
    margin-bottom:12px;
}

.online-user{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:5px;
}

.search-box input{
    width:100%;
    padding:10px;
    border:1px solid #dddfe2;
    border-radius:6px;
}

.search-box button{
    background:#1877f2;
    color:white;
    border:0;
    padding:0 12px;
    border-radius:6px;
}

.search-result{
    padding:10px;
    border-bottom:1px solid #eee;
}

/* MOBILE */

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .sidebar,
    .rightbar{
        display:none;
    }

    .auth-container{
        flex-direction:column;
        gap:25px;
        text-align:center;
    }

    .auth-left{
        max-width:500px;
    }

    .auth-left h1{
        font-size:40px;
    }

    .auth-left p{
        font-size:20px;
    }

    .auth-logo{
        width:130px;
        height:130px;
    }
}

footer{
    text-align:center;
    color:#65676b;
    padding:25px;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="auth-view">

<div class="auth-container">

<div class="auth-left">

<img src="said.png" class="auth-logo">

<h1>saidwali</h1>

<p>
پخیر راغلۍ د سیدولي خان کوهستاني بوک ته! 🌐
</p>

</div>

<div class="auth-right">

<div class="login-card">

<div id="login-error" class="error"></div>

<input
id="login-username"
type="text"
placeholder="Username، Email یا Phone"
autocomplete="username"
>

<input
id="login-password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button class="btn-login" onclick="login()">
سیسټم ته ننوتل

<div class="divider"></div>

<button class="btn-create" onclick="openRegister()">
نوی اکاونټ جوړول

</div>

</section>


<!-- ================= REGISTER ================= -->

<div id="register-modal" class="modal">

<div class="modal-content">

<span class="close" onclick="closeRegister()">×</span>

<h2>نوی اکاونټ جوړ کړئ</h2>

<p>دا خورا چټک او اسانه دی.</p>

<div id="register-error" class="error"></div>

<input
id="reg-fullname"
type="text"
placeholder="بشپړ نوم"
>

<input
id="reg-username"
type="text"
placeholder="Username"
>

<input
id="reg-email"
type="email"
placeholder="Email (اختیاري)"
>

<input
id="reg-phone"
type="text"
placeholder="Phone (اختیاري)"
>

<input
id="reg-password"
type="password"
placeholder="Password"
>

<button class="btn-create" style="width:100%" onclick="register()">
راجستر کول
</button>

</div>
</div>


<!-- ================= MAIN APP ================= -->

<section id="main-view">

<header class="topbar">

<div class="brand">
saidwali
</div>

<div class="top-user">

<img id="top-photo" src="said.png">

<span id="top-name">
کاروونکی
</span>

<button class="logout" onclick="logout()">
وتل
</button>

</div>

</header>


<div class="container">

<div class="grid">

<!-- SIDEBAR -->

<aside class="sidebar">

<button onclick="loadFeed()">
🏠 کور / Home
</button>

<button onclick="loadNotifications()">
🔔 خبرتیاوې
</button>

<button onclick="showProfile()">
👤 زما پروفایل
</button>

<button onclick="showFriends()">
👥 ملګري
</button>

<button onclick="showMessages()">
💬 Messenger
</button>

⭕ Stories
</button>

</aside>


<!-- CENTER -->

<main>

<!-- STORIES -->

<div class="card">

<h3 style="margin-bottom:10px">
Stories
</h3>

<div id="stories" class="story-row"></div>

</div>


<!-- CREATE POST -->

<div class="card">

<textarea
id="post-content"
class="post-input"
placeholder="څه فکر کوئ؟ دلته یې ولیکئ..."
></textarea>

<div class="post-actions">

<select id="post-privacy">
<option value="public">🌍 Public</option>

</select>

</button>

</div>

</div>

</main>


<!-- RIGHTBAR -->

<aside class="rightbar">

<div class="online-title">
🔎 د خلکو لټون
</div>

<div class="search-box">

<input
id="search-input"
placeholder="نوم یا username..."
>

<button onclick="searchUsers()">
لټون
</button>

</div>

<div id="search-results"></div>

<hr style="margin:15px 0">

🟢 ستا حساب
</div>

درته معلومات راوړل کېږي...
</div>

</aside>

</div>

</div>

</footer>

</section>


<script>

/* =====================================================
   IMPORTANT WORKER URL
===================================================== */

const API =
"https://saidwali-social-api.walizaad2.workers.dev";


/* =====================================================
   SESSION
===================================================== */

let token =
localStorage.getItem("saidwali_token") || "";

let currentUser = null;


/* =====================================================
   API REQUEST
===================================================== */

async function api(path, options = {}){

    const headers = {
        "Content-Type":"application/json",
        ...(options.headers || {})
    };

    if(token){
        headers.Authorization =
        "Bearer " + token;
    }

    const response =
    await fetch(API + path,{
        ...options,
        headers
    });

    let data;

    try{
        data = await response.json();
    }catch{
        data = {
            success:false,
            message:"Server response JSON نه و."
        };
    }

    if(!response.ok){

        if(response.status === 401){

            token = "";
            localStorage.removeItem(
                "saidwali_token"
            );

        }

        throw new Error(
            data.message ||
            "API Error"
        );
    }

    return data;
}


/* =====================================================
   REGISTER MODAL
===================================================== */

function openRegister(){

    document
    .getElementById("register-modal")
    .classList.add("show");

}

function closeRegister(){

    document
    .getElementById("register-modal")
    .classList.remove("show");

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const fullname =
    document
    .getElementById("reg-fullname")
    .value.trim();

    const username =
    document
    .getElementById("reg-username")
    .value.trim();

    const email =
    document
    .getElementById("reg-email")
    .value.trim();

    const phone =
    document
    .getElementById("reg-phone")
    .value.trim();

    const password =
    document
    .getElementById("reg-password")
    .value;

    const error =
    document.getElementById(
        "register-error"
    );

    error.style.display="none";

    if(!fullname || !username || !password){

        error.textContent =
        "بشپړ نوم، Username او Password ضروري دي.";

        error.style.display="block";

        return;
    }

    try{

        const data =
        await api(
            "/api/register",
            {
                method:"POST",
                body:JSON.stringify({
                    fullname,
                    username,
                    email:email || null,
                    phone:phone || null,
                    password
                })
            }
        );

        if(data.success){

            token = data.token;

            localStorage.setItem(
                "saidwali_token",
                token
            );

            currentUser = data.user;

            closeRegister();

            showApp();

            await loadFeed();

        }

    }catch(error){

        document
        .getElementById(
            "register-error"
        )
        .textContent = error.message;

        document
        .getElementById(
            "register-error"
        )
        .style.display="block";

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
    document
    .getElementById(
        "login-username"
    )
    .value.trim();

    const password =
    document
    .getElementById(
        "login-password"
    )
    .value;

    const error =
    document.getElementById(
        "login-error"
    );

    error.style.display="none";

    if(!username || !password){

        error.textContent =
        "Username او Password ولیکئ.";

        error.style.display="block";

        return;
    }

    try{

        const data =
        await api(
            "/api/login",
            {
                method:"POST",
                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        if(data.success){

            token = data.token;

            localStorage.setItem(
                "saidwali_token",
                token
            );

            currentUser =
            data.user;

            showApp();

            await loadFeed();

        }

    }catch(error){

        document
        .getElementById(
            "login-error"
        )
        .textContent =
        error.message;

        document
        .getElementById(
            "login-error"
        )
        .style.display =
        "block";

    }

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

    document
    .getElementById("auth-view")
    .style.display="none";

    document
    .getElementById("main-view")
    .style.display="block";

    updateUserUI();

}


/* =====================================================
   USER UI
===================================================== */

function updateUserUI(){

    if(!currentUser) return;

    document
    .getElementById("top-name")
    .textContent =
    currentUser.full_name ||
    currentUser.username;

    document
    .getElementById("account-info")
    .innerHTML = `
        <b>${escapeHTML(
            currentUser.full_name ||
            currentUser.username
        )}</b>
        <br>
        @${escapeHTML(
            currentUser.username
        )}
    `;

    if(
        currentUser.profile_photo
    ){

        document
        .getElementById(
            "top-photo"
        )
        .src =
        currentUser.profile_photo;

    }

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

    if(!token){

        showLogin();

        return;
    }

    try{

        const data =
        await api("/api/me");

        if(data.success){

            currentUser =
            data.user;

            showApp();

            await loadFeed();

        }

    }catch{

        showLogin();

    }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    document
    .getElementById(
        "auth-view"
    )
    .style.display="flex";

    document
    .getElementById(
        "main-view"
    )
    .style.display="none";

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        await api(
            "/api/logout",
            {
                method:"POST"
            }
        );

    }catch{}

    token="";

    currentUser=null;

    localStorage.removeItem(
        "saidwali_token"
    );

    showLogin();

}


/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

    const content =
    document
    .getElementById(
        "post-content"
    )
    .value.trim();

    const privacy =
    document
    .getElementById(
        "post-privacy"
    )
    .value;

    if(!content){

        alert("پوسټ خالي دی.");

        return;
    }

    try{

        await api(
            "/api/posts",
            {
                method:"POST",
                body:JSON.stringify({
                    content,
                    privacy
                })
            }
        );

        document
        .getElementById(
            "post-content"
        )
        .value="";

        await loadFeed();

    }catch(error){

        alert(error.message);

    }

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

    try{

        const data =
        await api(
            "/api/feed?limit=50"
        );

        const feed =
        document.getElementById(
            "feed"
        );

        if(
            !data.posts ||
            data.posts.length===0
        ){

            feed.innerHTML = `
                <div class="card">
                    تر اوسه کوم پوسټ نشته.
                    لومړی پوسټ ته جوړ کړئ.
                </div>
            `;

            return;
        }

        feed.innerHTML =
        data.posts
        .map(renderPost)
        .join("");

    }catch(error){

        document
        .getElementById(
            "feed"
        )
        .innerHTML = `
            <div class="card">
                ❌ ${escapeHTML(
                    error.message
                )}
            </div>
        `;

    }

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(post){

    const photo =
    post.profile_photo ||
    "said.png";

    return `

    <article class="card">

        <div class="post-header">

            <img
                class="avatar"
                src="${escapeAttr(photo)}"
            >

            <div>

                <div class="post-name">
                    ${escapeHTML(
                        post.full_name ||
                        post.username
                    )}
                </div>

                <div class="post-username">
                    @${escapeHTML(
                        post.username
                    )}
                    ·
                    ${escapeHTML(
                        post.created_at || ""
                    )}
                </div>

            </div>

        </div>

        <div class="post-content">
            ${escapeHTML(
                post.content || ""
            )}
        </div>

        <div class="post-stats">

            <span>
                👍 ${post.reactions_count || 0}
            </span>

            <span>
                💬 ${post.comments_count || 0}
            </span>

            <span>
                ↗️ ${post.shares_count || 0}
            </span>

        </div>

        <div class="post-buttons">

            <button
                onclick="reactPost(${post.id})"
            >
                👍 Like
            </button>

            <button
                onclick="loadComments(${post.id})"
            >
                💬 Comments
            </button>

        </div>

        <div id="comments-${post.id}"
             class="comments">
        </div>

    </article>

    `;

}


/* =====================================================
   REACTION
===================================================== */

async function reactPost(postId){

    try{

        await api(
            "/api/reactions",

/* =====================================================
   COMMENTS
===================================================== */

async function loadComments(postId){

    const box =
    document.getElementById(
        "comments-"+postId
    );

    try{

        const data =
        await api(
            "/api/comments?post_id="+
            postId
        );

        box.innerHTML = `

            <div>

                ${
                    (data.comments || [])
                    .map(c => `
                        <div class="comment">

                            <div class="comment-name">
                                ${escapeHTML(
                                    c.full_name ||
                                    c.username
                                )}
                            </div>

                            ${escapeHTML(
                                c.content
                            )}

                        </div>
                    `)
                    .join("")
                }

                <input
                    class="comment-input"
                    id="comment-${postId}"
                    placeholder="تبصره ولیکئ..."
                    onkeydown="
                        if(event.key==='Enter')
                        addComment(${postId})
                    "
                >

            </div>

        `;

    }catch(error){

        box.innerHTML =
        `<div class="error">
        ${escapeHTML(error.message)}
        </div>`;

    }

}


async function addComment(postId){

    const input =
    document.getElementById(
        "comment-"+postId
    );

    const content =
    input.value.trim();

    if(!content) return;

    try{

        await api(
            "/api/comments",
            {
                method:"POST",
                body:JSON.stringify({
                    post_id:postId,
                    content
                })
            }
        );

        await loadComments(postId);

    }catch(error){

        alert(error.message);

    }

}

async function loadStories(){

            "stories"
        );

        if(
            !data.stories ||

                    story.full_name ||
                    story.username
                )}

        `)
        .join("");

    }

}


function alertStory(text){

}


/* =====================================================
   SEARCH USERS
===================================================== */

async function searchUsers(){

    const q =
    document
    .getElementById(
        "search-input"
    )
    .value.trim();

    const box =
    document.getElementById(
        "search-results"
    );

    if(!q){

        box.innerHTML="";

        return;
    }

    try{

        const data =
        await api(
            "/api/search/users?q="+
            encodeURIComponent(q)
        );

        if(
            !data.users ||
            data.users.length===0
        ){

            box.innerHTML =
            "<p>کاروونکی پیدا نه شو.</p>";

            return;
        }

        box.innerHTML =
        data.users
        .map(user => `

            <div class="search-result">

                <b>
                    ${escapeHTML(
                        user.full_name ||
                        user.username
                    )}
                </b>

                <br>

                <small>
                    @${escapeHTML(
                        user.username
                    )}
                </small>

                <br>

                <button
                    style="
                    margin-top:5px;
                    background:#1877f2;
                    color:white;
                    border:0;
                    padding:5px 10px;
                    border-radius:5px;
                    "
                    onclick="sendFriend(${user.id})"
                >
                    👥 Friend
                </button>

                <button
                    style="
                    margin-top:5px;
                    background:#42b72a;
                    color:white;
                    border:0;
                    padding:5px 10px;
                    border-radius:5px;
                    "
                    onclick="follow(${user.id})"
                >
                    Follow
                </button>

            </div>

        `)
        .join("");

    }catch(error){

        box.innerHTML =
        `<p>${escapeHTML(
            error.message
        )}</p>`;

    }

}

/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}
