<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>

       ========================= */

<script>

  /* =====================================================
     SID WALI SOCIAL NETWORK
     FRONTEND - PART 2
     ===================================================== */

  /*
    اصلي Cloudflare Worker URL
  */

  const API_URL =
    "https://saidwali-social-api.walizaad2.workers.dev";


  /*
    Session token د Browser په localStorage کې ساتل کېږي.
  */

  let sessionToken =
    localStorage.getItem("saidwali_session_token") || "";

  let currentUser = null;


  /* =====================================================
     BASIC HELPERS
     ===================================================== */

  function $(id) {
    return document.getElementById(id);
  }


  function showElement(id) {
    const element = $(id);

    if (element) {
      element.classList.remove("hidden");
    }
  }


  function hideElement(id) {
    const element = $(id);

    if (element) {
      element.classList.add("hidden");
    }
  }


  function setMessage(id, message, type = "error") {

    const element = $(id);

    if (!element) {
      return;
    }

    element.textContent = message;

    element.className =
      "auth-message " + type;

    element.classList.remove("hidden");
  }


  function clearMessage(id) {

    const element = $(id);

    if (!element) {
      return;
    }

    element.textContent = "";

    element.className =
      "auth-message hidden";
  }


  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function safeURL(value) {

    if (!value) {
      return "";
    }

    return escapeHTML(value);
  }


  function showLoading(buttonId, loadingText) {

    const button = $(buttonId);

    if (!button) {
      return;
    }

    button.dataset.oldText =
      button.textContent;

    button.textContent =
      loadingText;

    button.disabled = true;

    button.classList.add("loading");
  }


  function hideLoading(buttonId) {

    const button = $(buttonId);

    if (!button) {
      return;
    }

    button.textContent =
      button.dataset.oldText || "";

    button.disabled = false;

    button.classList.remove("loading");
  }


  /* =====================================================
     API REQUEST FUNCTION
     ===================================================== */

  async function apiRequest(
    endpoint,
    options = {}
  ) {

    const headers = {
      "Content-Type":
        "application/json",

      ...(options.headers || {})
    };


    /*
      Bearer Session
    */

    if (sessionToken) {

      headers.Authorization =
        "Bearer " + sessionToken;
    }


    let response;

    try {

      response =
        await fetch(
          API_URL + endpoint,
          {
            ...options,
            headers
          }
        );

    } catch (error) {

      console.error(
        "Network error:",
        error
      );

      return {
        success: false,
        message:
          "Worker سره اړیکه ونه شوه. Internet او Worker URL وګوره."
      };
    }


    /*
      Server response JSON
    */

    let data;

    try {

      data =
        await response.json();

    } catch (error) {

      console.error(
        "JSON error:",
        error
      );

      return {
        success: false,
        message:
          "Worker صحیح JSON ځواب ورنه کړ.",
        http_status:
          response.status
      };
    }


    /*
      HTTP error
    */

    if (!response.ok) {

      return {
        ...data,
        success:
          data.success === true
            ? true
            : false,

        http_status:
          response.status
      };
    }


    return data;
  }


  /* =====================================================
     AUTH FORM SWITCHING
     ===================================================== */

  function showLoginForm() {

    hideElement("registerBox");
    showElement("loginBox");

    clearMessage(
      "registerMessage"
    );

    clearMessage(
      "loginMessage"
    );
  }


  function showRegisterForm() {

    hideElement("loginBox");
    showElement("registerBox");

    clearMessage(
      "loginMessage"
    );

    clearMessage(
      "registerMessage"
    );
  }


  /* =====================================================
     USERNAME VALIDATION
     ===================================================== */

  function isValidUsername(username) {

    /*
      Worker همدا قانون استعمالوي:

      English letters
      numbers
      .
      _
      -
    */

    return /^[A-Za-z0-9._-]+$/.test(
      username
    );
  }


  /* =====================================================
     REGISTER
     ===================================================== */

  async function registerUser() {

    clearMessage(
      "registerMessage"
    );


    const fullName =
      $("registerFullName")
        .value
        .trim();


    const username =
      $("registerUsername")
        .value
        .trim();


    const email =
      $("registerEmail")
        .value
        .trim();


    const password =
      $("registerPassword")
        .value;


    /*
      Required fields
    */

    if (!fullName) {

      setMessage(
        "registerMessage",
        "بشپړ نوم ولیکه."
      );

      return;
    }


    if (!username) {

      setMessage(
        "registerMessage",
        "Username ولیکه."
      );

      return;
    }


    if (
      !isValidUsername(
        username
      )
    ) {

      setMessage(
        "registerMessage",
        "Username یوازې English letters، numbers، .، _ او - کاروي."
      );

      return;
    }


    if (!password) {

      setMessage(
        "registerMessage",
        "Password ولیکه."
      );

      return;
    }


    if (
      password.length < 6
    ) {

      setMessage(
        "registerMessage",
        "Password لږ تر لږه ۶ حروف ولري."
      );

      return;
    }


    showLoading(
      "registerButton",
      "ثبت نام کېږي..."
    );


    /*
      Worker register endpoint
    */

    const result =
      await apiRequest(
        "/register",
        {
          method: "POST",

          body:
            JSON.stringify({
              username:
                username,

              password:
                password,

              email:
                email || null,

              full_name:
                fullName
            })
        }
      );


    hideLoading(
      "registerButton"
    );


    if (
      result.success
    ) {

      setMessage(
        "registerMessage",
        result.message ||
          "حساب په بریالیتوب جوړ شو.",
        "success"
      );


      /*
        لږ ځنډ وروسته Login page
      */

      setTimeout(
        () => {

          showLoginForm();

          $("loginIdentifier")
            .value =
              username;

          $("loginPassword")
            .value =
              "";

        },
        1200
      );


      return;
    }


    setMessage(
      "registerMessage",
      result.message ||
        "ثبت نام ناکام شو."
    );
  }


  /* =====================================================
     LOGIN
     ===================================================== */

  async function loginUser() {

    clearMessage(
      "loginMessage"
    );


    const identifier =
      $("loginIdentifier")
        .value
        .trim();


    const password =
      $("loginPassword")
        .value;


    if (!identifier) {

      setMessage(
        "loginMessage",
        "Username یا Email ولیکه."
      );

      return;
    }


    if (!password) {

      setMessage(
        "loginMessage",
        "Password ولیکه."
      );

      return;
    }


    showLoading(
      "loginButton",
      "ننوتل کېږي..."
    );


    /*
      Worker ممکن username یا email استعمال کړي.
      دواړه fields ورلېږو.
    */

    const result =
      await apiRequest(
        "/login",
        {
          method: "POST",

          body:
            JSON.stringify({

              username:
                identifier,

              email:
                identifier,

              password:
                password

            })
        }
      );


    hideLoading(
      "loginButton"
    );


    if (
      !result.success
    ) {

      setMessage(
        "loginMessage",
        result.message ||
          "Login ناکام شو."
      );

      return;
    }


    /*
      د مختلفو احتمالي response
      نومونو څخه token اخلو.
    */

    const token =
      result.token ||
      result.session_token ||
      result.sessionToken ||
      result.session ||
      result.data?.token ||
      result.data?.session_token ||
      result.data?.sessionToken ||
      "";


    if (!token) {

      console.error(
        "Login response:",
        result
      );


      setMessage(
        "loginMessage",
        "Login بریالی ښکاري، خو Session Token ونه موندل شو."
      );

      return;
    }


    /*
      Token Save
    */

    sessionToken =
      token;


    localStorage.setItem(
      "saidwali_session_token",
      sessionToken
    );


    setMessage(
      "loginMessage",
      result.message ||
        "په بریالیتوب داخل شوې.",
      "success"
    );


    /*
      Main application
    */

    await startApplication();
  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logoutUser() {

    try {

      if (sessionToken) {

        await apiRequest(
          "/logout",
          {
            method: "POST"
          }
        );

      }

    } catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }


    /*
      Local session پاکول
    */

    sessionToken = "";

    currentUser = null;

    localStorage.removeItem(
      "saidwali_session_token"
    );


    /*
      App بندول
    */

    hideElement("app");

    showElement("authPage");

    showLoginForm();


    $("loginIdentifier")
      .value = "";

    $("loginPassword")
      .value = "";


    setMessage(
      "loginMessage",
      "تاسو له حساب څخه ووتل.",
      "success"
    );
  }


  /* =====================================================
     CURRENT USER / ME
     ===================================================== */

  async function loadCurrentUser() {

    if (!sessionToken) {

      return {
        success: false,
        message:
          "Session نشته."
      };
    }


    const result =
      await apiRequest(
        "/me",
        {
          method: "GET"
        }
      );


    if (
      result.success
    ) {

      /*
        Worker response کې د user
        مختلف احتمالي structure ملاتړ
      */

      currentUser =
        result.user ||
        result.data?.user ||
        result.data ||
        null;

    }


    return result;
  }


  /* =====================================================
     START APPLICATION
     ===================================================== */

  async function startApplication() {

    hideElement("authPage");

    showElement("app");


    const result =
      await loadCurrentUser();


    if (
      !result.success
    ) {

      console.error(
        "Current user error:",
        result
      );


      sessionToken = "";

      currentUser = null;

      localStorage.removeItem(
        "saidwali_session_token"
      );


      hideElement("app");

      showElement("authPage");

      showLoginForm();


      setMessage(
        "loginMessage",
        result.message ||
          "Session ختم شوې، بیا Login وکړه."
      );

      return;
    }


    /*
      User UI تازه کول
    */

    updateUserUI();


    /*
      Feed وروسته په بل JS برخه کې
      load کېږي.
    */

    if (
      typeof loadFeed ===
      "function"
    ) {

      await loadFeed();

    }
  }


  /* =====================================================
     USER UI
     ===================================================== */

    if (!currentUser) {
      return;
    }


    const fullName =
      currentUser.full_name ||
      currentUser.name ||

      $("sidebarAvatar");


    const postAvatar =
      $("postAvatar");

        safeURL(profilePhoto);
    }


    if (
      postAvatar &&
      profilePhoto
    ) {

      postAvatar.src =
        safeURL(profilePhoto);

  }


  /* =====================================================
     PAGE CONTROL
     ===================================================== */

  function showFeedPage() {

    const mainContent =
      $("mainContent");

    if (!mainContent) {
      return;
    }


    mainContent.innerHTML = `

      <div id="feedPage">

        <div class="card">

          <div class="row">

            >

            <div>

              <strong>

            Feed لوډ کېږي...

    updateUserUI();

    ) {

     SEARCH KEY

  document.addEventListener(

      /*
        که token موجود وي،

      if (

    }
  );

</script>
<script>

console.log("FEED RESPONSE:", result);

                    <div class="muted">
                      @${escapeHTML(username)}
                    </div>
                  `

                ·
                ${escapeHTML(privacy)}

          <!-- POST MENU -->

          <button

            onclick="
              openPostMenu(${postId})
            "

          >
            ⋮
          </button>

        </div>


        <!-- POST CONTENT -->

        ${
          content
            ? `
              <div
                style="
                  margin-top:14px;
                  line-height:1.9;
                  white-space:pre-wrap;
                  word-break:break-word;
                "
              >
                ${escapeHTML(content)}
              </div>
            `
            : ""
        }


        <!-- MEDIA -->

        ${mediaHTML}


        <!-- COUNTS -->

        <div
          style="
            display:flex;
            justify-content:space-between;
            margin-top:12px;
            color:#65676b;
            font-size:13px;
          "
        >

          <span>
            👍
            <span id="like-count-${postId}">
              ${likesCount}
            </span>
          </span>

          <span>
            <span id="comment-count-${postId}">
              ${commentsCount}
            </span>
            تبصرې
          </span>

        </div>


        <!-- POST ACTIONS -->

        <div
          style="
            display:grid;
            grid-template-columns:
              1fr 1fr 1fr;
            border-top:
              1px solid #e4e6eb;
            border-bottom:
              1px solid #e4e6eb;
            margin-top:8px;
          "
        >

          <button
            class="sidebar-item"
            style="
              justify-content:center;
            "
            onclick="
              reactToPost(
                ${postId},
                'like'
              )
            "
          >
            👍 Like
          </button>


          <button
            class="sidebar-item"
            style="
              justify-content:center;
            "
            onclick="
              toggleComments(
                ${postId}
              )
            "
          >
            💬 Comment
          </button>


          <button
            class="sidebar-item"

              justify-content:center;
            "

                ${postId}
              )

        <!-- COMMENTS -->

              gap:7px;
              margin-top:10px;
            "
          >

              id="comment-input-${postId}"

              onkeydown="
                if(event.key==='Enter'){
                  addComment(${postId});
                }
              "
            >

            <button
              class="btn"
              onclick="

            >
              لېږل
            </button>

  /* =====================================================
     CREATE POST
     ===================================================== */

  async function createPost() {

    const contentInput =
      $("postContent");


    const mediaInput =
      $("postMediaURL");


    if (!contentInput) {

      return;
    }


    const content =
      contentInput.value.trim();


    const mediaURL =
      mediaInput
        ? mediaInput.value.trim()
        : "";


    if (
      !content &&
      !mediaURL
    ) {

      alert(
        "د پوسټ متن یا د عکس URL ولیکه."
      );

      return;
    }


    /*
      Posts table:
      user_id
      content
      privacy
      location
      feeling
      status
      created_at
      updated_at
    */

    const payload = {

      content:
        content,

      privacy:
        "public",

      location:
        "",

      feeling:
        "",

      status:
        "published"

    };


    /*
      که Worker د media_url
      ملاتړ کوي، هغه هم ورسره استوو.
    */

    if (mediaURL) {

      payload.media_url =
        mediaURL;

    }


    const result =
      await apiRequest(
        "/posts",
        {
          method: "POST",

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if (
      !result.success
    ) {

      alert(
        result.message ||
        "پوسټ جوړ نه شو."
      );

      return;
    }


    /*
      فورم پاکول
    */

    contentInput.value = "";


    if (mediaInput) {

      mediaInput.value = "";

    }


    /*
      Feed تازه کول
    */

    await loadFeed();

  }


  /* =====================================================
     LIKE / REACTION
     ===================================================== */

  async function reactToPost(
    postId,
    reactionType = "like"
  ) {

    const result =
      await apiRequest(
        `/posts/${postId}/reaction`,
        {
          method: "POST",

          body:
            JSON.stringify({
              reaction_type:
                reactionType
            })
        }
      );


    if (
      !result.success
    ) {

      alert(
        result.message ||
        "Reaction ونه شو."
      );

      return;
    }


    /*
      که server count راکړي،
      مستقیم یې تازه کوو.
    */

    const count =
      result.likes_count ??
      result.like_count ??
      result.reactions_count;


    if (
      count !== undefined
    ) {

      const countElement =
        $(
          `like-count-${postId}`
        );


      if (countElement) {

        countElement.textContent =
          count;

      }

    } else {

      /*
        که count نه وي،
        Feed بیا لوډوو.
      */

      await loadFeed();

    }

  }


  /* =====================================================
     REMOVE REACTION
     ===================================================== */

  async function removeReaction(
    postId
  ) {

    const result =
      await apiRequest(
        `/posts/${postId}/reaction`,
        {
          method: "DELETE"
        }
      );


    if (
      !result.success
    ) {

      alert(
        result.message ||
        "Reaction حذف نه شو."
      );

      return;
    }


    await loadFeed();

  }


  /* =====================================================
     TOGGLE COMMENTS
     ===================================================== */

  async function toggleComments(
    postId
  ) {

    const box =
      $(
        `comments-${postId}`
      );


    if (!box) {

      return;
    }


    const wasHidden =
      box.classList.contains(
        "hidden"
      );


    box.classList.toggle(
      "hidden"
    );


    if (
      !wasHidden
    ) {

      return;

    }


    await loadComments(
      postId
    );

  }


  /* =====================================================
     LOAD COMMENTS
     ===================================================== */

  async function loadComments(
    postId
  ) {

    const list =
      $(
        `comments-list-${postId}`
      );


    if (!list) {

      return;
    }


    list.innerHTML = `
      <div
        class="muted"
        style="padding:10px;"
      >
        تبصرې لوډ کېږي...
      </div>
    `;


    const result =
      await apiRequest(
        `/posts/${postId}/comments`,
        {
          method: "GET"
        }
      );


    if (
      !result.success
    ) {

      list.innerHTML = `
        <div
          class="muted"
          style="padding:10px;"
        >
          ${escapeHTML(
            result.message ||
            "تبصرې لوډ نه شوې."
          )}
        </div>
      `;

      return;
    }


    const comments =
      Array.isArray(
        result.comments
      )
        ? result.comments
        : Array.isArray(
            result.data
          )
          ? result.data
          : Array.isArray(
              result.results
            )
            ? result.results
            : Array.isArray(
                result.data?.comments
              )
              ? result.data.comments
              : [];


    if (
      !comments.length
    ) {

      list.innerHTML = `
        <div
          class="muted"
          style="
            padding:10px;
            text-align:center;
          "
        >
          تر اوسه تبصره نشته.
        </div>
      `;

      return;
    }


    list.innerHTML =
      comments
        .map(
          comment =>
            renderComment(
              comment
            )
        )
        .join("");

  }


  /* =====================================================
     RENDER COMMENT
     ===================================================== */

  function renderComment(
    comment
  ) {

    const name =
      comment.full_name ||
      comment.author_name ||
      comment.username ||
      "کارن";


    const content =
      comment.content ||
      "";


    const createdAt =
      comment.created_at ||
      "";


    const commentId =
      comment.id;


    const avatar =
      comment.profile_photo ||
      comment.avatar_url ||
      "";


    return `

      <div
        style="
          display:flex;
          gap:8px;
          margin-bottom:8px;
        "
      >

        <img
          class="avatar-small"
          src="${safeURL(avatar)}"
          alt="avatar"
          onerror="
            this.style.visibility='hidden';
          "
        >

        <div
          style="
            flex:1;
          "
        >

          <div
            style="
              background:#f0f2f5;
              border-radius:12px;
              padding:8px 11px;
            "
          >

            <strong>
              ${escapeHTML(name)}
            </strong>

            <div
              style="
                margin-top:3px;
                line-height:1.7;
              "
            >
              ${escapeHTML(content)}
            </div>

          </div>

          <div
            class="muted"
            style="
              margin-top:3px;
              padding-right:8px;
            "
          >
            ${escapeHTML(createdAt)}

            ${
              commentId
                ? `
                  ·
                  <button
                    style="
                      border:0;
                      background:none;
                      color:#c62828;
                      cursor:pointer;
                    "
                    onclick="
                      deleteComment(
                        ${commentId},
                        ${comment.post_id}
                      )
                    "
                  >
                    حذف
                  </button>
                `
                : ""
            }

          </div>

        </div>

      </div>

    `;

  }


  /* =====================================================
     ADD COMMENT
     ===================================================== */

  async function addComment(
    postId
  ) {

    const input =
      $(
        `comment-input-${postId}`
      );


    if (!input) {

      return;
    }


    const content =
      input.value.trim();


    if (!content) {

      return;
    }


    input.disabled =
      true;


    const result =
      await apiRequest(
        `/posts/${postId}/comments`,
        {
          method: "POST",

          body:
            JSON.stringify({
              content:
                content
            })
        }
      );


    input.disabled =
      false;


    if (
      !result.success
    ) {

      alert(
        result.message ||
        "تبصره ونه لېږل شوه."
      );

      return;
    }


    input.value = "";


    /*
      Comments بیا لوډول
    */

    await loadComments(
      postId
    );


    /*
      Comment count تازه کول
    */

    const countElement =
      $(
        `comment-count-${postId}`
      );


    if (
      countElement &&
      result.comments_count !== undefined
    ) {

      countElement.textContent =
        result.comments_count;

    }

  }


  /* =====================================================
     DELETE COMMENT
     ===================================================== */

  async function deleteComment(
    commentId,
    postId
  ) {

    if (
      !confirm(
        "ایا دا تبصره حذف کول غواړې؟"
      )
    ) {

      return;
    }


    const result =
      await apiRequest(
        `/comments/${commentId}`,
        {
          method: "DELETE"
        }
      );


    if (
      !result.success
    ) {

      alert(
        result.message ||
        "تبصره حذف نه شوه."
      );

      )
    ) {

    const result =
      await apiRequest(

      alert(

    }


    const postElement =
      $(

  /* =====================================================

     ===================================================== */

  async function sharePost(
    postId
  ) {

    const shareURL =
      window.location.origin +
      window.location.pathname +
      "?post=" +
      encodeURIComponent(
        postId
      );


    try {

      if (
        navigator.share
      ) {

        await navigator.share({

          title:
            "سیدولي شبکه",

          text:
            "دا پوسټ وګوره",

          url:
            shareURL

        });

      } else if (
        navigator.clipboard
      ) {

        await navigator.clipboard.writeText(
          shareURL
        );

        alert(
          "د پوسټ لینک Copy شو."
        );

      } else {

        prompt(
          "د پوسټ لینک:",
          shareURL
        );

      }

    } catch (error) {

      console.log(
        "Share cancelled:",
        error
      );

    }

  }

   ===================================================== */

async function saveProfile() {

  const fullNameInput =
    $("profileFullName");

  const usernameInput =
    $("profileUsername");

  const bioInput =
    $("profileBio");

  const avatarInput =
    $("profileAvatarURL");

  const coverInput =
    $("profileCoverURL");


  if (!fullNameInput) {
    return;
  }


  const fullName =
    fullNameInput.value.trim();


  const username =
    usernameInput
      ? usernameInput.value.trim()
      : "";


  const bio =
    bioInput
      ? bioInput.value.trim()
      : "";


  const avatarURL =
    avatarInput
      ? avatarInput.value.trim()
      : "";


  const coverURL =
    coverInput
      ? coverInput.value.trim()
      : "";


  if (!fullName) {

    setMessage(
      "profileMessage",
      "بشپړ نوم ولیکه."
    );

    return;

  }


  if (
    username &&
    !isValidUsername(username)
  ) {

    setMessage(
      "profileMessage",
      "Username یوازې English letters، numbers، .، _ او - کاروي."
    );

    return;

  }


  showLoading(
    "saveProfileButton",
    "خوندي کېږي..."
  );


  const payload = {

    full_name:
      fullName,

    username:
      username,

    bio:
      bio,

    profile_photo_url:
      avatarURL,

    cover_photo_url:
      coverURL

  };


  const result =
    await apiRequest(
      "/profile",
      {
        method: "PUT",

        body:
          JSON.stringify(
            payload
          )
      }
    );


  hideLoading(
    "saveProfileButton"
  );


  if (
    !result.success
  ) {

    setMessage(
      "profileMessage",
      result.message ||
        "پروفایل خوندي نه شو."
    );

    return;

  }


  /*
    Server ممکن تازه user
    object راکړي.

  if (result.user) {

    currentUser =
      result.user;

  } else if (
    result.data?.user
  ) {

    currentUser =
      result.data.user;

  } else {

    /*
      که server user واپس نه کړي،
      /me بیا اخلو.

    await loadCurrentUser();

  }


  updateUserUI();

  fillProfileForm();


  setMessage(
    "profileMessage",
    result.message ||
      "پروفایل په بریالیتوب خوندي شو.",
    "success"
  );

}

/* =====================================================

   ===================================================== */

async function acceptFriendRequest(
  requestId,
  senderId
) {

  const payload = {

    request_id:
      requestId

  };


  /*
    sender_id هم ورکوو،
    ځکه د Worker implementation
    ممکن دا field وغواړي.
  */

  if (senderId) {

    payload.sender_id =
      senderId;

  }


  const result =
    await apiRequest(
      "/friends/accept",
      {
        method: "POST",

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if (
    !result.success
  ) {

    alert(
      result.message ||
      "غوښتنه قبوله نه شوه."
    );

    return;

  }


  const item =
    $(
      `friend-request-${requestId}`
    );


  if (item) {

    item.remove();

  }


  await loadFriends();

  await loadFriendRequests();


  alert(
    result.message ||
    "ملګرتیا قبوله شوه."
  );

}

  requestId,

) {

  const item =

  if (item) {

  await loadFriendRequests();


  alert(
    result.message ||
    "د ملګرتیا غوښتنه رد شوه."

) {

  if (

    container.innerHTML = `

      <div
        class="muted"
        style="
          text-align:center;
          padding:30px;
        "
      >

        ${escapeHTML(
          result.message ||
          "پیغامونه لوډ نه شول."
        )}

    return;
  }

    Array.isArray(
      result.messages
    )
      ? result.messages

          result.data

        ? result.data
        : Array.isArray(
            result.results
          )
          ? result.results
          : Array.isArray(
              result.data?.messages
            )
            ? result.data.messages
            : [];


  if (
    !messages.length
  ) {

      <div
        class="muted"
        style="
          text-align:center;
          padding:40px 10px;
        "
      >

        <div

            margin-top:8px;

        >

            margin-top:5px;
          "
        >
          لومړی پیغام ته ولېږه.

  }

      .map(

          renderMessage(

          )

      .join("");

    د وروستي پیغام خواته Scroll
  */

  container.scrollTop =

}


/* =====================================================
   RENDER MESSAGE
   ===================================================== */

function renderMessage(
  message
) {

  const senderId =
    message.sender_id ||
    message.user_id;


  const isMine =
    currentUser &&
    Number(senderId) ===
    Number(currentUser.id);


  const content =
    message.content ||
    "";


  const createdAt =
    message.created_at ||
    "";


  const messageType =
    message.message_type ||
    "text";


  const mediaURL =
    message.media_url ||
    "";


  let body = "";


  if (
    content
  ) {

    body += `

      <div
        style="
          white-space:pre-wrap;
          word-break:break-word;
        "
      >
        ${escapeHTML(content)}
      </div>

    `;

  }


  if (
    mediaURL
  ) {

    body += `

      <img
        src="${safeURL(mediaURL)}"
        alt="media"
        style="
          max-width:100%;
          max-height:300px;
          border-radius:10px;
          margin-top:6px;
        "
        onerror="
          this.style.display='none';
        "
      >

    `;

  }


  if (
    !body
  ) {

    body = `
      <span class="muted">
        ${escapeHTML(messageType)}
      </span>
    `;

  }


  return `

    <div
      style="
        display:flex;
        justify-content:
          ${isMine ? "flex-start" : "flex-end"};
        margin-bottom:8px;
      "
    >

      <div
        style="
          max-width:75%;
          padding:9px 12px;
          border-radius:16px;
          background:
            ${isMine
              ? "#1877f2"
              : "#f0f2f5"};
          color:
            ${isMine
              ? "#fff"
              : "#111"};
        "
      >

        ${body}

        <div
          style="
            font-size:10px;
            opacity:.7;
            margin-top:4px;
          "
        >

          ${escapeHTML(
            createdAt
          )}

          ${
            isMine
              ? (
                  Number(
                    message.is_read
                  ) === 1
                    ? " · ✓✓"
                    : " · ✓"
                )
              : ""
          }

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

  if (
    !activeConversationId
  ) {

    alert(
      "لومړی Chat انتخاب کړه."
    );

    return;

  }


  const input =
    $("messageInput");


  if (!input) {
    return;
  }


  const content =
    input.value.trim();


  if (!content) {
    return;
  }


  const button =
    $("sendMessageButton");


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "لېږل کېږي...";

  }


  const result =
    await apiRequest(
      `/conversations/${activeConversationId}/messages`,
      {
        method: "POST",

        body:
          JSON.stringify({
            content:
              content,

            message_type:
              "text"
          })
      }
    );


  if (button) {

    button.disabled =
      false;

    button.textContent =
      "لېږل";

  }


  if (
    !result.success
  ) {

    alert(
      result.message ||
      "پیغام ونه لېږل شو."
    );

    return;

  }


  input.value = "";


  await loadConversationMessages(
    activeConversationId
  );


  await loadConversations();

}


/* =====================================================
   MARK CONVERSATION READ
   ===================================================== */

async function markConversationRead(
  conversationId
) {

  const result =
    await apiRequest(
      `/conversations/${conversationId}/read`,
      {
        method: "POST"
      }
    );


  if (
    !result.success
  ) {

    console.log(
      "mark read:",
      result.message
    );

  }

}


/* =====================================================
   CREATE NEW CONVERSATION
   ===================================================== */

async function newConversation() {

  const username =
    prompt(
      "د هغه کارن Username ولیکه چې ورسره Chat جوړول غواړې:"
    );


  if (!username) {
    return;
  }


  const cleanUsername =
    username.trim();


  if (!cleanUsername) {
    return;
  }


  /*
    لومړی user پیدا کوو.
  */

  const search =
    await apiRequest(
      "/users/search?q=" +
      encodeURIComponent(
        cleanUsername
      ),
      {
        method: "GET"
      }
    );


  if (
    !search.success
  ) {

    alert(
      search.message ||
      "کارن پیدا نه شو."
    );

    return;

  }


  const users =
    Array.isArray(
      search.users
    )
      ? search.users
      : Array.isArray(
          search.data
        )
        ? search.data
        : [];


  const user =
    users.find(
      item =>
        String(
          item.username ||
          ""
        ).toLowerCase() ===
        cleanUsername.toLowerCase()
    ) ||
    users[0];


  if (!user) {

    alert(
      "دا کارن پیدا نه شو."
    );

    return;

  }


  if (
    currentUser &&
    Number(user.id) ===
    Number(currentUser.id)
  ) {

    alert(
      "له خپل ځان سره Chat نشې جوړولای."
    );

    return;

  }


  const result =
    await apiRequest(
      "/conversations",
      {
        method: "POST",

        body:
          JSON.stringify({
            user_id:
              user.id,

            conversation_type:
              "private"
          })
      }
    );


  if (
    !result.success
  ) {

    alert(
      result.message ||
      "Conversation جوړ نه شو."
    );

    return;

  }


  const conversation =
    result.conversation ||
    result.data?.conversation ||
    result.data ||
    result;


  const conversationId =
    conversation.id ||
    conversation.conversation_id;


  if (!conversationId) {

    await loadConversations();

    alert(
      result.message ||
      "Conversation جوړ شو."
    );

    return;

  }


  await loadConversations();


  await openConversation(
    conversationId,
    user.full_name ||
    user.name ||
    user.username ||
    "Chat"
  );

}


/* =====================================================
   OPEN MESSAGES FROM NAVIGATION
   ===================================================== */

function openMessagesPage() {

  loadMessagesPage();

}

   DATA-PAGE SUPPORT FOR MESSAGES
   ===================================================== */

document.addEventListener(

  function(event) {

    const target =
      event.target.closest(

      );


    if (!target) {

      openMessagesPage();

    }

/* =====================================================
   RESPONSIVE CHAT
   ===================================================== */

function setupMessagesResponsive() {

  const styleId =
    "messages-responsive-style";


  if (
    document.getElementById(
      styleId
    )
  ) {

    return;

  }


  const style =
    document.createElement(
      "style"
    );


  style.id =
    styleId;


  style.textContent = `

    @media (
      max-width: 700px
    ) {

      .messages-layout {

        grid-template-columns:
          1fr !important;

      }

      .messages-layout
      > .card:first-child {

        max-height:
          300px;

        overflow-y:
          auto;

      }

    }

  `;


  document.head.appendChild(
    style
  );

}

   INITIALIZE PART 5
   ===================================================== */

setupMessagesResponsive();

/* =====================================================
   RENDER NOTIFICATION
   ===================================================== */

function renderNotification(
  notification
) {

  const id =
    notification.id;


  const type =
    notification.type ||
    "notification";


  const title =
    notification.title ||
    "خبرتیا";


  const message =
    notification.message ||
    notification.body ||
    "";


  const createdAt =
    notification.created_at ||
    "";


  const isRead =
    Number(
      notification.is_read
    ) === 1;


  const actorName =
    notification.actor_name ||
    notification.full_name ||
    "";


  let icon =
    "🔔";


  if (
    type.includes(
      "friend"
    )
  ) {

    icon =
      "👥";

  } else if (
    type.includes(
      "like"
    )
  ) {

    icon =
      "👍";

  } else if (
    type.includes(
      "comment"
    )
  ) {

    icon =
      "💬";

  } else if (
    type.includes(
      "message"
    )
  ) {

    icon =
      "✉️";

  }


  return `

    <div
      id="notification-${id}"
      style="
        display:flex;
        align-items:flex-start;
        gap:10px;
        padding:12px 5px;
        border-bottom:
          1px solid #e4e6eb;
        background:

            isRead
              ? "transparent"
              : "#eef5ff"
          };
        border-radius:8px;
        margin-bottom:4px;
      "
    >

      <div
        style="
          font-size:25px;
        "
      >
        ${icon}
      </div>


      <div
        style="
          flex:1;
        "
      >

        <strong>
          ${escapeHTML(title)}
        </strong>


        ${
          actorName
            ? `
              <div
                style="
                  margin-top:2px;
                "
              >
                ${escapeHTML(
                  actorName
                )}
              </div>
            `
            : ""
        }


        ${
          message
            ? `
              <div
                class="muted"
                style="
                  margin-top:3px;
                  line-height:1.7;
                "
              >
                ${escapeHTML(
                  message
                )}
              </div>
            `
            : ""
        }


        <div
          class="muted"
          style="
            margin-top:5px;
            font-size:11px;
          "
        >
          ${escapeHTML(
            createdAt
          )}
        </div>

      </div>


      ${
        !isRead
          ? `
            <button
              class="btn btn-secondary"
              onclick="
                markNotificationRead(
                  ${id}
                )
              "
            >
              لوستل شوی
            </button>
          `
          : `
            <span
              class="muted"
              style="
                font-size:12px;
              "
            >
              ✓ لوستل شوی
            </span>
          `
      }

    </div>

  `;

}


/* =====================================================
   MARK NOTIFICATION READ
   ===================================================== */

async function markNotificationRead(
  notificationId
) {

  const result =
    await apiRequest(
      `/notifications/${notificationId}/read`,
      {
        method: "POST"
      }
    );


  if (
    !result.success
  ) {

    alert(
      result.message ||
      "خبرتیا لوستل شوې ونه ګڼل شوه."
    );

    return;

  }


  const item =
    $(
      `notification-${notificationId}`
    );


  if (item) {

    item.style.background =
      "transparent";


    const button =
      item.querySelector(
        "button"
      );


    if (button) {

      button.outerHTML = `
        <span
          class="muted"
          style="
            font-size:12px;
          "
        >
          ✓ لوستل شوی
        </span>
      `;

    }

  }


  await refreshNotificationCount();

}


/* =====================================================
   NOTIFICATION BADGE
   ===================================================== */

function updateNotificationBadge(
  notifications
) {

  const unread =
    notifications.filter(
      notification =>
        Number(
          notification.is_read
        ) !== 1
    ).length;


  const badges =
    document.querySelectorAll(
      "[data-notification-badge]"
    );


  badges.forEach(
    badge => {

      if (
        unread > 0
      ) {

        badge.textContent =
          unread > 99
            ? "99+"
            : unread;

        badge.style.display =
          "inline-flex";

      } else {

        badge.textContent =
          "";

        badge.style.display =
          "none";

      }

    }
  );


  /*
    که HTML کې badge نه وي،
    په ID سره یې هم پیدا کوو.
  */

  const commonBadge =
    $("notificationBadge");


  if (commonBadge) {

    if (
      unread > 0
    ) {

      commonBadge.textContent =
        unread > 99
          ? "99+"
          : unread;

      commonBadge.style.display =
        "inline-flex";

    } else {

      commonBadge.style.display =
        "none";

    }

  }

}


/* =====================================================
   REFRESH NOTIFICATION COUNT
   ===================================================== */

async function refreshNotificationCount() {

  const result =
    await apiRequest(
      "/notifications",
      {
        method: "GET"
      }
    );


  if (
    !result.success
  ) {

    return;

  }


  const notifications =
    Array.isArray(
      result.notifications
    )
      ? result.notifications
      : Array.isArray(
          result.data
        )
        ? result.data
        : Array.isArray(
            result.results
          )
          ? result.results
          : [];


  updateNotificationBadge(
    notifications
  );

}

async function logoutUser() {

  if (

  }


  const result =

      "Logout server response:",

function clearLocalSession() {

    localStorage.removeItem(

function navigateTo(
  page

    return;

  switch (

      break;

/* =====================================================

   ===================================================== */

let notificationTimer =
  null;


function startNotificationTimer() {

  if (
    notificationTimer
  ) {

    clearInterval(
      notificationTimer
    );

  }


  notificationTimer =
    setInterval(
      function() {

        if (
          sessionToken
        ) {

          refreshNotificationCount();

        }

      },
      30000
    );

}


/* =====================================================
   STOP NOTIFICATION TIMER
   ===================================================== */

function stopNotificationTimer() {

  if (
    notificationTimer
  ) {

    clearInterval(
      notificationTimer
    );

    notificationTimer =
      null;

  }

}

  const statusElements =
    document.querySelectorAll(

  statusElements.forEach(
    element => {

      if (
        navigator.onLine
      ) {

        element.textContent =
          "آنلاین";

        element.style.color =
          "#2e7d32";

      } else {

        element.textContent =
          "Offline";

        element.style.color =
          "#c62828";

      }

    }
  );

}


window.addEventListener(

window.addEventListener(

async function editProfile() {

    alert(
      "لومړی Login وکړه."

    return;

  }


  const name =
    prompt(
      "خپل نوم ولیکه:",
      currentUser.full_name ||

      ""
    );


  if (name === null) return;


  const bio =
    prompt(

      ""

  if (bio === null) return;


  const location =
    prompt(
      "Location ولیکه:",
      currentUser.location ||
      ""
    );


  if (location === null) return;


  const result =
    await apiRequest(
      "/profile",
      {
        method:"PUT",

        body:
          JSON.stringify({
            full_name:
              name.trim(),

            bio:
              bio.trim(),

            location:
              location.trim()
          })
      }
    );


  if (!result.success) {

    alert(
      result.message ||
      "Profile بدل نه شو."
    );

    return;

  }


  const updated =
    result.user ||
    result.data?.user ||
    result.data;


  if (updated) {

    currentUser =
      updated;

  } else {

    const me =
      await apiRequest(
        "/me",
        {
          method:"GET"

    if (me.success) {

        me.user ||
        me.data?.user ||
        me.data;

    }

  }


  alert(
    "Profile په بریالیتوب بدل شو."

  await loadProfile();

  }

<script>

/* =====================================================
   PART 8
   MEDIA SELECTOR
   PHOTO / VIDEO POST UI
   ===================================================== */

let selectedPostMedia = [];


/* =====================================================
   CREATE MEDIA POST BOX
   ===================================================== */

function openMediaPostComposer() {

  const input =
    document.createElement("input");

  input.type = "file";

  input.accept =
    "image/*,video/*";

  input.multiple = true;


  input.onchange =
    function() {

      const files =
        Array.from(
          input.files || []
        );

      if (!files.length) {
        return;
      }


      selectedPostMedia =
        files;


      showMediaPreview(
        files
      );

    };


  input.click();

}


/* =====================================================
   SHOW MEDIA PREVIEW
   ===================================================== */

function showMediaPreview(
  files
) {

  let old =
    $("mediaPreviewBox");


  if (old) {
    old.remove();
  }


  const box =
    document.createElement(
      "div"
    );


  box.id =
    "mediaPreviewBox";


  box.className =
    "card";


  box.style.marginTop =
    "10px";


  box.innerHTML = `

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
      "
    >

      <strong>
        ټاکل شوي فایلونه
      </strong>


      <button
        class="btn btn-secondary"
        onclick="
          clearSelectedMedia()
        "
      >
        پاکول
      </button>

    </div>


    <div
      id="mediaPreviewItems"
      style="
        display:grid;
        grid-template-columns:
          repeat(
            auto-fill,
            minmax(130px,1fr)
          );
        gap:10px;
        margin-top:12px;
      "
    ></div>

  `;

    $("mainContent") ||
    document.body;


  target.prepend(
    box
  );


  const items =
    $("mediaPreviewItems");


  files.forEach(
    (
      file,
      index
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const item =
        document.createElement(
          "div"
        );


      item.style =
        `
        position:relative;
        border-radius:10px;
        overflow:hidden;
        background:#eee;
        min-height:120px;
        `;


      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        item.innerHTML = `

          <img
            src="${url}"
            style="
              width:100%;
              height:150px;
              object-fit:cover;
              display:block;
            "
          >

          <div
            style="
              padding:5px;
              font-size:11px;
              word-break:break-word;
            "
          >
            ${escapeHTML(
              file.name
            )}

        `;

      } else if (

          "video/"
        )
      ) {

            src="${url}"
            controls
            style="
              width:100%;
              height:150px;
              object-fit:cover;
              display:block;
            "
          ></video>

          <div
            style="
              padding:5px;
              font-size:11px;
              word-break:break-word;

            ${escapeHTML(

            )}

        `;

      }


      items.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   CLEAR SELECTED MEDIA
   ===================================================== */

function clearSelectedMedia() {

  selectedPostMedia =
    [];


  const box =
    $("mediaPreviewBox");


  if (box) {
    box.remove();
  }

}


/* =====================================================
   GET MEDIA TYPE
   ===================================================== */

function getMediaType(
  file
) {

  if (
    file.type.startsWith(
      "image/"
    )
  ) {

    return "image";

  }


  if (
    file.type.startsWith(
      "video/"
    )
  ) {

    return "video";

  }


  return "file";

}


/* =====================================================
   CHECK MEDIA SIZE
   ===================================================== */

function validateMediaFile(
  file
) {

  if (!file) {
    return false;
  }


  const maxImageSize =
    10 * 1024 * 1024;


  const maxVideoSize =
    100 * 1024 * 1024;


  if (
    file.type.startsWith(
      "image/"
    )
  ) {

    if (
      file.size >
      maxImageSize
    ) {

      alert(
        "عکس باید تر 10MB کم وي."
      );

      return false;

    }

  }


  if (
    file.type.startsWith(
      "video/"
    )
  ) {

    if (
      file.size >
      maxVideoSize
    ) {

      alert(
        "ویډیو باید تر 100MB کمه وي."
      );

      return false;

    }

  }


  return true;

}


/* =====================================================
   VALIDATE SELECTED MEDIA
   ===================================================== */

function validateSelectedMedia() {

  if (
    !selectedPostMedia.length
  ) {

    return true;

  }


  for (
    const file
    of selectedPostMedia
  ) {

    if (
      !validateMediaFile(
        file
      )
    ) {

      return false;

    }

  }


  return true;

}


/* =====================================================
   MEDIA INFORMATION
   ===================================================== */

function getMediaInformation() {

  return selectedPostMedia.map(
    file => ({

      name:
        file.name,

      size:
        file.size,

      type:
        getMediaType(
          file
        ),

      mime_type:
        file.type

    })
  );

}


/* =====================================================
   CREATE POST WITH MEDIA
   ===================================================== */

async function createMediaPost(
  content = "",
  privacy = "public"
) {

  if (
    !sessionToken
  ) {

    alert(
      "لومړی Login وکړه."
    );

    return;

  }


  if (
    !validateSelectedMedia()
  ) {

    return;

  }


  /*
    اوسنی Worker د POST /posts
    endpoint لري.

    Media فایلونه تر هغه نه پورته کوو
    څو Worker کې رسمي Media Upload
    endpoint اضافه نه شي.
  */

  const result =
    await apiRequest(
      "/posts",
      {

        method:
          "POST",

        body:
          JSON.stringify({

            content:
              String(
                content || ""
              ).trim(),

            privacy:
              privacy,

            media:
              getMediaInformation()

          })

      }
    );


  if (
    !result.success
  ) {

    alert(
      result.message ||
      "Post جوړ نه شو."
    );

    return;

  }


  clearSelectedMedia();


  alert(
    "Post په بریالیتوب جوړ شو."
  );


  if (
    typeof showFeedPage ===
    "function"
  ) {

    await showFeedPage();

  }

}


/* =====================================================
   MEDIA BUTTON SUPPORT
   ===================================================== */

document.addEventListener(
  "click",
  function(event) {

    const target =
      event.target.closest(
        "[data-action='media']"
      );


    if (!target) {
      return;
    }


    event.preventDefault();


    openMediaPostComposer();

  }
);


/* =====================================================
   FILE INPUT SUPPORT
   ===================================================== */

document.addEventListener(
  "change",
  function(event) {

    const input =
      event.target.closest(
        "[data-media-input]"
      );


    if (!input) {
      return;
    }


    const files =
      Array.from(
        input.files || []
      );


    if (!files.length) {
      return;
    }


    selectedPostMedia =
      files;


    showMediaPreview(
      files
    );

  }
);


/* =====================================================
   PROFILE AVATAR PREVIEW
   ===================================================== */

function previewProfileImage(
  file,
  imageElement
) {

  if (
    !file ||
    !imageElement
  ) {

    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "یوازې عکس انتخابولی شې."
    );

    return;

  }


  if (
    !validateMediaFile(
      file
    )
  ) {

    return;

  }


  const url =
    URL.createObjectURL(
      file
    );


  imageElement.src =
    url;


  imageElement.style.display =
    "block";

}


/* =====================================================
   COVER IMAGE PREVIEW
   ===================================================== */

function previewCoverImage(
  file,
  element
) {

  if (
    !file ||
    !element
  ) {

    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Cover باید عکس وي."
    );

    return;

  }


  if (
    !validateMediaFile(
      file
    )
  ) {

    return;

  }


  const url =
    URL.createObjectURL(
      file
    );


  element.style.backgroundImage =
    `url("${url}")`;


  element.style.backgroundSize =
    "cover";


  element.style.backgroundPosition =
    "center";

}


/* =====================================================
   MEDIA DEBUG INFORMATION
   ===================================================== */

function getSelectedMediaCount() {

  return selectedPostMedia.length;

}


function getSelectedMediaNames() {

  return selectedPostMedia.map(
    file =>
      file.name
  );

}


/* =====================================================
   PART 8 READY
   ===================================================== */

window.selectedPostMedia =
  selectedPostMedia;

window.openMediaPostComposer =
  openMediaPostComposer;

window.clearSelectedMedia =
  clearSelectedMedia;

window.createMediaPost =
  createMediaPost;

window.getSelectedMediaCount =
  getSelectedMediaCount;

window.getSelectedMediaNames =
  getSelectedMediaNames;

</script>

/* =====================================================

async function globalSearch(
  query
) {

  const q =
    String(
      query || ""
    ).trim();


  if (!q) {

    return [];

  }


  const result =
    await apiRequest(
      "/users/search?q=" +
      encodeURIComponent(
        q
      ),
      {
        method:"GET"
      }
    );


  if (
    !result.success
  ) {

    return [];

  }


  if (
    Array.isArray(
      result.users
    )
  ) {

    return result.users;

  }


  if (
    Array.isArray(
      result.data
    )
  ) {

    return result.data;

  }


  if (
    Array.isArray(
      result.results
    )
  ) {

    return result.results;

  }


  return [];

}

/* =====================================================
   SEARCH HISTORY
   ===================================================== */

function saveSearchHistory(
  query
) {

  const q =
    String(
      query || ""
    ).trim();


  if (!q) return;


  try {

    let history =
      JSON.parse(
        localStorage.getItem(
          "saidwali_search_history"
        ) ||
        "[]"
      );


    if (
      !Array.isArray(
        history
      )
    ) {

      history = [];

    }


    history =
      history.filter(
        item =>
          item !== q
      );


    history.unshift(
      q
    );


    history =
      history.slice(
        0,
        10
      );


    localStorage.setItem(
      "saidwali_search_history",
      JSON.stringify(
        history
      )
    );

  } catch (
    error
  ) {

    console.log(
      "Search history:",
      error
    );

  }

}

}

    );

/* =====================================================
   FORMAT MESSAGE TIME
   ===================================================== */

function formatMessageTime(
  value
) {

  if (!value) {
    return "";
  }


  try {

    const date =
      new Date(
        value
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return escapeHTML(
        String(value)
      );

    }


    return date.toLocaleString(
      "ps-AF",
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  } catch (
    error
  ) {

    return escapeHTML(
      String(value)
    );

  }

}

  ) {

  }

async function updateFriendRequestBadge() {

  const result =
    await apiRequest(
      "/friends/requests",
      {
        method:"GET"
      }
    );


  if (
    !result.success
  ) {

    return 0;

  }


  const requests =
    Array.isArray(
      result.requests
    )
      ? result.requests
      : Array.isArray(
          result.data
        )
        ? result.data
        : [];


  const count =
    requests.length;


  const badges =
    document.querySelectorAll(
      "[data-friend-badge], .friend-request-badge"
    );


  badges.forEach(
    badge => {

      if (
        count > 0
      ) {

        badge.textContent =
          count > 99
            ? "99+"
            : String(
                count
              );

        badge.style.display =
          "inline-flex";

      } else {

        badge.textContent =
          "";

        badge.style.display =
          "none";

      }

    }
  );


  return count;

}

    !result.success

      Number(

        success:true,
        user:currentUser

    } else {

  let user =

async function loadProfilePosts(

  container.innerHTML = `

    <div
      class="card"
      style="
        margin:0;
        padding:20px;

      Posts لوډ کېږي...

    د /feed endpoint څخه Posts اخلو
    او یوازې د همدې کاروونکي Posts ښیو.
  */

  const result =
    await apiRequest(
      "/feed",
      {
        method:"GET"
      }
    );


  if (
    !result.success
  ) {

    container.innerHTML =
      "";

    return;

  }


  const posts =
    Array.isArray(
      result.posts

      ? result.posts
      : Array.isArray(
          result.data
        )
        ? result.data
        : Array.isArray(
            result.results

  const userPosts =

/* =====================================================

   ===================================================== */

async function saveProfileChanges(
  event
) {

  if (event) {

    event.preventDefault();

  }


  if (!currentUser) {

    return;

  }


  const name =
    String(
      $("profileName")?.value ||
      ""
    ).trim();


  const username =
    String(
      $("profileUsername")?.value ||
      ""
    ).trim();


  const bio =
    String(
      $("profileBio")?.value ||
      ""
    ).trim();


  const location =
    String(
      $("profileLocation")?.value ||
      ""
    ).trim();


  const website =
    String(
      $("profileWebsite")?.value ||
      ""
    ).trim();


  const avatar_url =
    String(
      $("profileAvatar")?.value ||
      ""
    ).trim();


  const cover_url =
    String(
      $("profileCover")?.value ||
      ""
    ).trim();


  if (!name) {

    alert(
      "نوم باید ولیکل شي."
    );

    return;

  }


  const result =
    await apiRequest(
      "/profile",
      {

        method:
          "PUT",

        body:
          JSON.stringify({

            name:
              name,

            username:
              username,

            bio:
              bio,

            location:
              location,

            website_url:
              website,

            avatar_url:
              avatar_url,

            cover_url:
              cover_url

          })

      }
    );


  if (!result.success) {

    alert(
      result.message ||
      "پروفایل تازه نه شو."
    );

    return;

  }


  const updatedUser =
    result.user ||
    result.data ||
    result.profile;


  if (
    updatedUser
  ) {

    currentUser =
      {
        ...currentUser,
        ...updatedUser
      };

  } else {

    currentUser =
      {
        ...currentUser,
        name:
          name,
        username:
          username,
        bio:
          bio,
        location:
          location,
        website_url:
          website,
        avatar_url:
          avatar_url,
        cover_url:
          cover_url
      };

  }


  try {

    localStorage.setItem(
      "currentUser",
      JSON.stringify(
        currentUser
      )
    );

  } catch (
    error
  ) {

    console.warn(
      "Could not save current user:",
      error
    );

  }


  alert(
    "پروفایل په بریالیتوب تازه شو."
  );


  await loadProfile(
    currentUser.id
  );

}

/* =====================================================
   START PRIVATE CONVERSATION
   ===================================================== */

async function startPrivateConversation(
  userId,
  name = "Chat"
) {

  if (!userId) return;


  const result =
    await apiRequest(
      "/conversations",
      {

        method:
          "POST",

        body:
          JSON.stringify({

            user_id:
              Number(
                userId
              ),

            conversation_type:
              "private"

          })

      }
    );


  if (!result.success) {

    /*
      که Conversation مخکې موجوده وي
      او Worker د create endpoint
      مختلف response ورکړي، conversations
      بیا اخلو.
    */

    const conversationsResult =
      await apiRequest(
        "/conversations",
        {
          method:"GET"
        }
      );


    if (
      conversationsResult.success
    ) {

      const conversations =
        Array.isArray(
          conversationsResult.conversations
        )
          ? conversationsResult.conversations
          : Array.isArray(
              conversationsResult.data
            )
            ? conversationsResult.data
            : [];


      const existing =
        conversations.find(
          item =>
            Number(
              item.user_id ||
              item.other_user_id
            ) ===
            Number(
              userId
            )
        );


      if (
        existing &&
        typeof openConversation ===
          "function"
      ) {

        await openConversation(
          existing.id ||
          existing.conversation_id,
          name
        );

        return;

      }

    }


    alert(
      result.message ||
      "Chat جوړ نه شو."
    );

    return;

  }


  const conversation =
    result.conversation ||
    result.data ||
    result;


  const conversationId =
    conversation.id ||
    conversation.conversation_id;


  if (
    conversationId &&
    typeof openConversation ===
      "function"
  ) {

    await openConversation(
      conversationId,
      name
    );

    return;

  }


  if (
    typeof loadMessagesPage ===
      "function"
  ) {

    await loadMessagesPage();

  }

}


/* =====================================================
   PROFILE DATE
   ===================================================== */

function formatProfileDate(
  value
) {

  if (!value) {
    return "";
  }


  try {

    const date =
      new Date(
        value
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return escapeHTML(
        String(value)
      );

    }


    return date.toLocaleDateString(
      "ps-AF",
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  } catch (
    error
  ) {

    return escapeHTML(
      String(value)
    );

  }

}

   ===================================================== */

function renderMessage(
  message
) {

  const senderId =
    message.sender_id ||

  const own =

    Number(
      senderId
    ) === Number(

    );

  const content =

    "";

  return `

            );

        "
      >

        ${
          type !== "text" &&
          media
            ? `
              <div
                style="
                  margin-bottom:6px;
                "
              >

                  type === "image"
                    ? `
                      <img

                          border-radius:8px;
                        "
                      >
                    `
                    : `
                      <a
                        href="${safeURL(media)}"
                        target="_blank"
                        rel="noopener"
                        style="
                          color:inherit;
                        "
                      >
                        📎 فایل
                      </a>
                    `
                }
              </div>
            `
            : ""
        }

        ${
          content
            ? `
              <div
                style="
                  white-space:pre-wrap;
                  line-height:1.6;
                "
              >
                ${escapeHTML(
                  content
                )}
              </div>
            `
            : ""
        }

        ${
          created
            ? `
              <div
                style="
                  margin-top:4px;
                  font-size:9px;
                  opacity:.7;
                "
              >
                ${formatMessageTime(
                  created
                )}
              </div>
            `
            : ""
        }

      </div>

    </div>

  `;

}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendConversationMessage(
  event
) {

  if (event) {

    event.preventDefault();

  }

  if (!activeConversationId) {

    return;

  }

  const input =
    $("messageInput");

  if (!input) return;

  const content =
    String(
      input.value ||
      ""
    ).trim();

  if (!content) return;

  input.disabled = true;

  const result =
    await apiRequest(
      `/conversations/${Number(
        activeConversationId
      )}/messages`,
      {

        method:
          "POST",

        body:
          JSON.stringify({

            content:
              content,

            message_type:
              "text"

          })

      }
    );

  input.disabled = false;

  if (!result.success) {

    alert(
      result.message ||
      "پیغام ونه لېږل شو."
    );

    return;
  }

  input.value = "";

  await loadConversationMessages();

  await loadConversations();

  input.focus();

}


/* =====================================================
   MARK READ
   ===================================================== */

async function markConversationRead() {

  if (!activeConversationId) return;

  await apiRequest(
    `/conversations/${Number(
      activeConversationId
    )}/read`,
    {
      method:"POST"
    }
  );

}


/* =====================================================
   AUTO REFRESH
   ===================================================== */

function startMessagesRefresh() {

  stopMessagesRefresh();

  messagesRefreshTimer =
    setInterval(
      async function() {

        if (
          activeConversationId
        ) {

          await loadConversationMessages();

          await markConversationRead();

        }

      },
      7000
    );

}


function stopMessagesRefresh() {

  if (
    messagesRefreshTimer
  ) {

    clearInterval(
      messagesRefreshTimer
    );

    messagesRefreshTimer =
      null;
  }

}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollMessagesToBottom() {

  const container =
    $("messagesList");

  if (!container) return;

  container.scrollTop =
    container.scrollHeight;

}


/* =====================================================
   MESSAGE TIME
   ===================================================== */

function formatMessageTime(
  value
) {

  if (!value) return "";

  try {

    const date =
      new Date(
        value
      );

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return escapeHTML(
        String(value)
      );

    }

    return date.toLocaleString(
      "ps-AF",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  } catch (
    error
  ) {

    return escapeHTML(
      String(value)
    );

  }

}


/* =====================================================
   MESSAGES NAVIGATION
   ===================================================== */

document.addEventListener(
  "click",
  function(event) {

    const target =
      event.target.closest(
        "[data-nav='messages']"
      );

    if (!target) return;

    event.preventDefault();

    loadMessagesPage();

  }
);


/* =====================================================
   CLEANUP
   ===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopMessagesRefresh();

  }
);


/* =====================================================
   GLOBAL EXPORTS
   ===================================================== */

window.loadMessagesPage =
  loadMessagesPage;

window.loadConversations =
  loadConversations;

window.openConversation =
  openConversation;

window.loadConversationMessages =
  loadConversationMessages;

window.sendConversationMessage =
  sendConversationMessage;

window.markConversationRead =
  markConversationRead;

window.startMessagesRefresh =
  startMessagesRefresh;

window.stopMessagesRefresh =
  stopMessagesRefresh;

window.scrollMessagesToBottom =
  scrollMessagesToBottom;

);

/* =====================================================
   NOTIFICATION ICON
   ===================================================== */

function getNotificationIcon(
  type
) {

  const value =
    String(
      type ||
      ""
    ).toLowerCase();


  if (
    value.includes(
      "friend"
    )
  ) {

    return "👥";

  }


  if (
    value.includes(
      "like"
    ) ||
    value.includes(
      "reaction"
    )
  ) {

    return "❤️";

  }


  if (
    value.includes(
      "comment"
    )
  ) {

    return "💬";

  }


  if (
    value.includes(
      "message"
    )
  ) {

    return "✉️";

  }


  if (
    value.includes(
      "follow"
    )
  ) {

    return "➕";

  }


  if (
    value.includes(
      "post"
    )
  ) {

    return "📝";

  }


  return "🔔";

}

/* =====================================================
   NOTIFICATION CLICK
   ===================================================== */

async function handleNotificationClick(
  notificationId,
  referenceType,
  referenceId
) {

  if (notificationId) {

    await apiRequest(
      `/notifications/${Number(
        notificationId
      )}/read`,
      {
        method:"POST"
      }
    );

  }


  const type =
    String(
      referenceType ||
      ""
    ).toLowerCase();


  if (
    referenceId &&
    (
      type === "post" ||
      type === "posts"
    )
  ) {

    if (
      typeof openPost ===
      "function"
    ) {

      await openPost(
        Number(referenceId)
      );

      return;

    }


    if (
      typeof loadFeed ===
      "function"
    ) {

      await loadFeed();

      return;

    }

  }


  if (
    referenceId &&
    (
      type === "user" ||
      type === "users" ||
      type === "profile"
    )
  ) {

    await loadProfile(
      Number(referenceId)
    );

/* =====================================================
   NOTIFICATION BADGE
   ===================================================== */

function updateNotificationBadge(
  count
) {

  const value =
    Math.max(
      0,
      Number(
        count || 0
      )
    );


  const selectors = [

    "#notificationBadge",

    "#notificationsBadge",

    "[data-notification-badge]"

  ];


  let found =
    false;


  selectors.forEach(
    selector => {

      document
        .querySelectorAll(
          selector
        )
        .forEach(
          badge => {

            found = true;


            if (
              value > 0
            ) {

              badge.textContent =
                value > 99
                  ? "99+"
                  : String(value);

              badge.style.display =
                "inline-flex";

            } else {

              badge.textContent =
                "";

              badge.style.display =
                "none";

            }

          }
        );

    }
  );


  /*
    که HTML کې Badge موجود نه وي،
    د Notifications navigation لپاره
    یو کوچنی Badge جوړوو.
  */

  if (!found) {

    const nav =
      document.querySelector(
        "[data-nav='notifications']"
      );


    if (nav) {

      let badge =
        nav.querySelector(
          ".auto-notification-badge"
        );


      if (!badge) {

        badge =
          document.createElement(
            "span"
          );

        badge.className =
          "auto-notification-badge";


        badge.style.cssText = `

          display:none;
          align-items:center;
          justify-content:center;
          min-width:18px;
          height:18px;
          padding:0 5px;
          margin-right:5px;
          border-radius:9px;
          background:#e41e3f;
          color:white;
          font-size:10px;
          font-weight:bold;

        `;


        nav.appendChild(
          badge
        );

      }


      if (
        value > 0
      ) {

        badge.textContent =
          value > 99
            ? "99+"
            : String(value);

        badge.style.display =
          "inline-flex";

      } else {

        badge.textContent =
          "";

        badge.style.display =
          "none";

      }

    }

  }

}


/* =====================================================
   NOTIFICATION COUNT
   ===================================================== */

async function loadNotificationCount() {

  const result =
    await apiRequest(
      "/notifications",
      {
        method:"GET"
      }
    );


  if (
    !result ||
    !result.success
  ) {

    return;

  }


  const notifications =
    Array.isArray(
      result.notifications
    )
      ? result.notifications
      : Array.isArray(
          result.data
        )
        ? result.data
        : [];


  const unreadCount =
    notifications.filter(
      item =>
        Number(
          item.is_read
        ) === 0
    ).length;


  updateNotificationBadge(
    unreadCount
  );

}


/* =====================================================
   AUTO NOTIFICATION REFRESH
   ===================================================== */

function startNotificationsRefresh() {

  stopNotificationsRefresh();


  loadNotificationCount();


  notificationsRefreshTimer =
    setInterval(
      function() {

        loadNotificationCount();

      },

    );

}


function stopNotificationsRefresh() {

  if (
    notificationsRefreshTimer

    clearInterval(
      notificationsRefreshTimer
    );

    notificationsRefreshTimer =
      null;

  }

}

async function sendFriendRequestFromSearch(
  userId,
  button
) {

  if (!userId) return;


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "⏳ لېږل کېږي...";

  }


  const result =
    await apiRequest(
      "/friends/request",
      {

        method:
          "POST",

        body:
          JSON.stringify({

            receiver_id:
              Number(
                userId
              )

          })

      }
    );


  if (!result.success) {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "👥 ملګری";

    }


    alert(
      result.message ||
      "د ملګرتیا غوښتنه ونه لېږل شوه."
    );

    return;

  }


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "⏳ غوښتنه لېږل شوې";

  }


  alert(
    "د ملګرتیا غوښتنه ولېږل شوه. 👥"
  );

}
