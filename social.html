<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سیدولي افغاني نړیواله ټولنیزه شبکه</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f0f2f5;
    color:#1c1e21;
}

button,input,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* HEADER */

.header{
    height:60px;
    background:#1877f2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    background:white;
    color:#1877f2;
    border:none;
    border-radius:20px;
    padding:8px 14px;
    font-weight:bold;
}

/* LOGIN */

.auth-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.auth-title{
    text-align:center;
    color:#1877f2;
    font-size:28px;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input{
    width:100%;
    border:1px solid #ddd;
    border-radius:8px;
    padding:13px;
    margin-bottom:12px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#1877f2;
    box-shadow:0 0 0 2px rgba(24,119,242,.12);
}

.primary-btn{
    width:100%;
    border:none;
    border-radius:8px;
    background:#1877f2;
    color:white;
    padding:13px;
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.success-btn{
    width:100%;
    border:none;
    border-radius:8px;
    background:#42b72a;
    color:white;
    padding:13px;
    font-size:16px;
    font-weight:bold;
}

.divider{
    height:1px;
    background:#ddd;
    margin:20px 0;
}

.message{
    text-align:center;
    margin-top:15px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.message.error{
    display:block;
    background:#ffe5e5;
    color:#b00020;
}

.message.success{
    display:block;
    background:#e5f7e2;
    color:#237a18;
}

/* APP */

.app{
    display:none;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:240px 1fr 240px;
    gap:18px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
    margin-bottom:18px;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    padding:15px;
}

.user-card{
    text-align:center;
    padding:10px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
    display:block;
    margin:0 auto 10px;
}

.menu-item{
    width:100%;
    border:none;
    background:white;
    padding:12px;
    text-align:right;
    border-radius:7px;
    margin-bottom:4px;
    font-size:15px;
}

.menu-item:hover{
    background:#f0f2f5;
}

/* CREATE POST */

.create-post{
    padding:16px;
}

.create-top{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
}

.small-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ddd;
}

.post-input{
    flex:1;
    border:none;
    background:#f0f2f5;
    border-radius:22px;
    padding:12px 18px;
    outline:none;
}

.post-textarea{
    width:100%;
    min-height:90px;
    resize:vertical;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
}

.post-actions{
    display:flex;
    gap:8px;
}

.post-actions button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:7px;
    background:#f0f2f5;
}

/* POSTS */

.post{
    padding:16px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.post-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ddd;
}

.post-author{
    font-weight:bold;
}

.post-date{
    color:#777;
    font-size:12px;
}

.post-content{
    white-space:pre-wrap;
    line-height:1.8;
    margin-bottom:15px;
    text-align:right;
}

.post-actions-row{
    border-top:1px solid #eee;
    padding-top:10px;
    display:flex;
    gap:5px;
}

.post-action{
    flex:1;
    border:none;
    background:white;
    padding:10px;
    border-radius:6px;
}

.post-action:hover{
    background:#f0f2f5;
}

/* RIGHT */

.info{
    padding:15px;
}

.info h3{
    margin-bottom:12px;
}

.info p{
    line-height:1.8;
    color:#555;
}

/* PROFILE */

.profile{
    padding:0;
}

.cover{
    height:180px;
    background:linear-gradient(135deg,#1877f2,#42b72a);
}

.profile-info{
    padding:20px;
    text-align:center;
}

.profile-avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    border:4px solid white;
    margin-top:-70px;
    background:#ddd;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */

@media(max-width:850px){
    .grid{
        grid-template-columns:1fr;
    }

    .left-sidebar,
    .right-sidebar{
        display:none;
    }

    .container{
        padding:10px;
    }

    .header{
        padding:0 10px;
    }

    .logo{
        font-size:17px;
    }
}

</style>
</head>

<body>

<!-- =========================
     LOGIN / REGISTER
========================= -->

<section id="authPage" class="auth-page">

<div class="auth-box">

    <div class="auth-title">
        سیدولي بوک 🌐
    </div>

    <div class="auth-subtitle">
        سیدولي افغاني نړیواله ټولنیزه شبکه
    </div>

    <input
        id="fullname"
        class="input"
        type="text"
        placeholder="بشپړ نوم"
    >

    <input
        id="username"
        class="input"
        type="text"
        placeholder="مستعار نوم / Username"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="پاسورډ"
    >

    <button
        class="primary-btn"
        onclick="login()"
    >
        ننوتل
    </button>

    <button
        class="success-btn"
        onclick="register()"
    >
        نوی اکاونټ جوړول
    </button>

    <div id="authMessage" class="message"></div>

</div>

</section>


<!-- =========================
     MAIN APPLICATION
========================= -->

<section id="app" class="app">

<header class="header">

    <div class="logo">
        سیدولي بوک 🌐
    </div>

    <div class="header-actions">

        <button
            class="header-btn"
            onclick="loadFeed()"
        >
            🏠 کور
        </button>

        <button
            class="header-btn"
            onclick="logout()"
        >
            وتل
        </button>

    </div>

</header>


<div class="container">

<div class="grid">


<!-- LEFT SIDEBAR -->

<aside class="left-sidebar">

<div class="card sidebar">

    <div class="user-card">

        <img
            id="sidebarAvatar"
            class="avatar"
            src=""
            alt=""
        >

        <h3 id="sidebarName">
            کاروونکی
        </h3>

        <p id="sidebarUsername">
            @username
        </p>

    </div>

    <hr style="margin:12px 0;border:0;border-top:1px solid #eee;">

    <button class="menu-item" onclick="showProfile()">
        👤 زما پروفایل
    </button>

    <button class="menu-item" onclick="loadFeed()">
        📰 News Feed
    </button>

    <button class="menu-item">
        👥 ملګري
    </button>

    <button class="menu-item">
        💬 پیغامونه
    </button>

    <button class="menu-item">
        🔔 خبرتیاوې
    </button>

    <button class="menu-item">
        📖 کیسې
    </button>

    <button class="menu-item">
        👥 ګروپونه
    </button>

    <button class="menu-item">
        📄 پاڼې
    </button>

</div>

</aside>


<!-- CENTER -->

<main>

<!-- PROFILE -->

<div id="profileCard" class="card profile hidden">

    <div class="cover"></div>

    <div class="profile-info">

        <img
            id="profileAvatar"
            class="profile-avatar"
            src=""
            alt=""
        >

        <h2 id="profileName">
            کاروونکی
        </h2>

        <p id="profileUsername">
            @username
        </p>

    </div>

</div>


<!-- CREATE POST -->

<div class="card create-post">

    <div class="create-top">

        <img
            id="createAvatar"
            class="small-avatar"
            src=""
            alt=""
        >

        <input
            class="post-input"
            placeholder="څه فکر کوئ؟"
            onclick="openPostBox()"
        >

    </div>

    <div id="postBox" class="hidden">

        <textarea
            id="postContent"
            class="post-textarea"
            placeholder="خپل پوسټ ولیکئ..."
        ></textarea>

        <div class="post-actions">

            <button onclick="createPost()">
                📝 خپرول
            </button>

            <button onclick="closePostBox()">
                لغوه
            </button>

        </div>

    </div>

</div>


<!-- FEED -->

<div id="feed">

    <div class="loading">
        د پوسټونو معلومات راټولېږي...
    </div>

</div>

</main>


<!-- RIGHT SIDEBAR -->

<aside class="right-sidebar">

<div class="card info">

    <h3>
        🌐 سیدولي ټولنیزه شبکه
    </h3>

    <p>
        دلته کولی شئ له خپلو ملګرو سره
        اړیکه ونیسئ، پوسټونه جوړ کړئ،
        نظرونه ولیکئ او ټولنیز فعالیت وکړئ.
    </p>

</div>

<div class="card info">

    <h3>
        📢 حالت
    </h3>

    <p id="serverStatus">
        د Worker حالت کتل کېږي...
    </p>

</div>

</aside>


</div>

</div>

</section>


<script>

/* =====================================================
   WORKER API
===================================================== */

const WORKER_URL =
    "https://saidwali-social-api.walizaad2.workers.dev";


/* =====================================================
   GLOBAL USER
===================================================== */

let currentUser = null;


/* =====================================================
   ELEMENT HELPERS
===================================================== */

function $(id){
    return document.getElementById(id);
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message,type="error"){

    const box = $("authMessage");

    box.textContent = message;

    box.className =
        "message " + type;

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const fullname =
        $("fullname").value.trim();

    const username =
        $("username").value.trim();

    const password =
        $("password").value;

    if(!fullname || !username || !password){

        showMessage(
            "مهرباني وکړئ ټول بکسونه ډک کړئ",
            "error"
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            "پاسورډ باید لږ تر لږه ۶ توري ولري",
            "error"
        );

        return;
    }

    try{

        showMessage(
            "اکاونټ جوړېږي...",
            "success"
        );

        const response =
            await fetch(
                WORKER_URL + "/api/register",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        fullname,
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            showMessage(
                data.message ||
                data.error ||
                "اکاونټ جوړ نه شو",
                "error"
            );

            return;
        }

        showMessage(
            "اکاونټ په بریالیتوب جوړ شو. اوس Login وکړئ.",
            "success"
        );

        $("password").value = "";

    }catch(error){

        console.error(error);

        showMessage(
            "له Worker سره اړیکه ونه شوه",
            "error"
        );

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
        $("username").value.trim();

    const password =
        $("password").value;

    if(!username || !password){

        showMessage(
            "Username او Password ولیکئ",
            "error"
        );

        return;
    }

    try{

        showMessage(
            "ننوتل روان دي...",
            "success"
        );

        const response =
            await fetch(
                WORKER_URL + "/api/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            showMessage(
                data.message ||
                data.error ||
                "Username یا Password غلط دی",
                "error"
            );

            return;
        }

        currentUser =
            data.user;

        localStorage.setItem(
            "saidwali_user",
            JSON.stringify(currentUser)
        );

        showApp();

    }catch(error){

        console.error(error);

        showMessage(
            "له Worker سره اړیکه ونه شوه",
            "error"
        );

    }

}


/* =====================================================
   SHOW APPLICATION
===================================================== */

function showApp(){

    $("authPage").style.display =
        "none";

    $("app").style.display =
        "block";

    updateUserUI();

    loadFeed();

    checkServer();

}


/* =====================================================
   USER UI
===================================================== */

function updateUserUI(){

    if(!currentUser)
        return;

    const name =
        currentUser.full_name ||
        currentUser.fullname ||
        currentUser.username;

    const username =
        currentUser.username;

    $("sidebarName").textContent =
        name;

    $("sidebarUsername").textContent =
        "@" + username;

    $("profileName").textContent =
        name;

    $("profileUsername").textContent =
        "@" + username;

    const avatar =
        currentUser.profile_photo ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name);

    $("sidebarAvatar").src =
        avatar;

    $("createAvatar").src =
        avatar;

    $("profileAvatar").src =
        avatar;

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

    $("profileCard")
        .classList.add("hidden");

    $("feed").innerHTML =
        '<div class="loading">پوسټونه راټولېږي...</div>';

    try{

        const response =
            await fetch(
                WORKER_URL + "/api/feed"
            );

        const data =
            await response.json();

        if(!response.ok){

            $("feed").innerHTML =
                '<div class="card post">د Feed معلومات ترلاسه نه شول.</div>';

            return;
        }

        let posts =
            Array.isArray(data)
            ? data
            : data.results || data.posts || [];

        renderPosts(posts);

    }catch(error){

        console.error(error);

        $("feed").innerHTML =
            '<div class="card post">له Worker سره اړیکه ونه شوه.</div>';

    }

}


/* =====================================================
   RENDER POSTS
===================================================== */

function renderPosts(posts){

    if(!posts.length){

        $("feed").innerHTML = `
            <div class="card post">
                <h3>تر اوسه کوم پوسټ نشته</h3>
                <p style="margin-top:10px;color:#777;">
                    لومړی پوسټ تاسو جوړ کړئ.
                </p>
            </div>
        `;

        return;
    }

    $("feed").innerHTML =
        posts.map(post => {

            const content =
                escapeHTML(
                    post.content || ""
                );

            const author =
                escapeHTML(
                    post.full_name ||
                    post.username ||
                    "کاروونکی"
                );

            const date =
                post.created_at || "";

            return `

            <article class="card post">

                <div class="post-header">

                    <img
                        class="post-avatar"
                        src="https://ui-avatars.com/api/?name=${encodeURIComponent(author)}"
                        alt=""
                    >

                    <div>

                        <div class="post-author">
                            ${author}
                        </div>

                        <div class="post-date">
                            ${date}
                        </div>

                    </div>

                </div>

                <div class="post-content">
                    ${content}
                </div>

                <div class="post-actions-row">

                    <button
                        class="post-action"
                        onclick="likePost(${post.id})"
                    >
                        👍 خوښول
                    </button>

                    <button
                        class="post-action"
                        onclick="commentPost(${post.id})"
                    >
                        💬 تبصره
                    </button>

                    <button
                        class="post-action"
                        onclick="sharePost(${post.id})"
                    >
                        ↗️ شریکول
                    </button>

                </div>

            </article>

            `;

        }).join("");

}


/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

    if(!currentUser){

        alert("لومړی Login وکړئ");

        return;
    }

    const content =
        $("postContent").value.trim();

    if(!content){

        alert("د پوسټ متن ولیکئ");

        return;
    }

    try{

        const response =
            await fetch(
                WORKER_URL + "/api/posts",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        user_id:
                            currentUser.id,
                        content
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            alert(
                data.message ||
                data.error ||
                "پوسټ جوړ نه شو"
            );

            return;
        }

        $("postContent").value =
            "";

        closePostBox();

        await loadFeed();

    }catch(error){

        console.error(error);

        alert(
            "پوسټ جوړولو کې ستونزه رامنځته شوه"
        );

    }

}


/* =====================================================
   POST BOX
===================================================== */

function openPostBox(){

    $("postBox")
        .classList.remove("hidden");

    $("postContent")
        .focus();

}

function closePostBox(){

    $("postBox")
        .classList.add("hidden");

}


/* =====================================================
   PROFILE
===================================================== */

function showProfile(){

    $("profileCard")
        .classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    currentUser =
        null;

    localStorage.removeItem(
        "saidwali_user"
    );

    $("app").style.display =
        "none";

    $("authPage").style.display =
        "flex";

}


/* =====================================================
   SERVER CHECK
===================================================== */

async function checkServer(){

    try{

        const response =
            await fetch(
                WORKER_URL + "/"
            );

        const data =
            await response.json();

        if(data.success){

            $("serverStatus").innerHTML =
                "🟢 Worker آنلاین دی<br>" +
                "🟢 Database وصل دی";

        }else{

            $("serverStatus").textContent =
                "Worker ځواب ورکړ، خو API معلومات سم نه دي.";

        }

    }catch(error){

        $("serverStatus").textContent =
            "🔴 Worker ته اړیکه نشته.";

    }

}


/* =====================================================
   LIKE
===================================================== */

async function likePost(postId){

    if(!currentUser){

        alert("لومړی Login وکړئ");

        return;
    }

    try{

        const response =
            await fetch(
                WORKER_URL + "/api/posts/" +
                postId +
                "/like",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        user_id:
                            currentUser.id
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            alert(
                data.message ||
                data.error ||
                "Like API لا فعال نه دی"
            );

            return;
        }

        loadFeed();

    }catch(error){

        alert(
            "Like کولو کې ستونزه"
        );

    }

}


/* =====================================================
   COMMENT
===================================================== */

async function commentPost(postId){

    if(!currentUser){

        alert("لومړی Login وکړئ");

        return;
    }

    const content =
        prompt("خپله تبصره ولیکئ:");

    if(!content)
        return;

    try{

        const response =
            await fetch(
                WORKER_URL +
                "/api/posts/" +
                postId +
                "/comments",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        user_id:
                            currentUser.id,
                        content
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            alert(
                data.message ||
                data.error ||
                "Comment API لا فعال نه دی"
            );

            return;
        }

        loadFeed();

    }catch(error){

        alert(
            "Comment کولو کې ستونزه"
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

    if(!currentUser){

        alert("لومړی Login وکړئ");

        return;
    }

    try{

        const response =
            await fetch(
                WORKER_URL +
                "/api/posts/" +
                postId +
                "/share",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        user_id:
                            currentUser.id
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            alert(
                data.message ||
                data.error ||
                "Share API لا فعال نه دی"
            );

            return;
        }

        alert("پوسټ شریک شو");

    }catch(error){

        alert(
            "Share کولو کې ستونزه"
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

   RESTORE SESSION
===================================================== */

try{

    const saved =
        localStorage.getItem(
            "saidwali_user"
        );

    if(saved){

        currentUser =
            JSON.parse(saved);

        if(currentUser &&
           currentUser.id){

            showApp();

        }

    }

}catch(error){

    localStorage.removeItem(
        "saidwali_user"
    );

}
