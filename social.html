   ===================================================== */

async function saveProfileChanges() {

  if (
    !currentUser
  ) {

    alert(
      "Login وکړئ."
    );

    return;

  }


  const name =
    $("editProfileName")?.value
      .trim() || "";


  const username =
    $("editProfileUsername")?.value
      .trim() || "";


  const bio =
    $("editProfileBio")?.value
      .trim() || "";


  const avatar_url =
    $("editProfileAvatar")?.value
      .trim() || "";


  const cover_url =
    $("editProfileCover")?.value
      .trim() || "";


  const location =
    $("editProfileLocation")?.value
      .trim() || "";


  const website_url =
    $("editProfileWebsite")?.value
      .trim() || "";


  if (
    !name &&
    !username
  ) {

    alert(
      "نوم یا Username باید موجود وي."
    );

    return;

  }


  const result =
    await apiRequest(
      "/profile",
      {

        method:
          "PUT",

        body:
          JSON.stringify({

            name,
            username,
            bio,
            avatar_url,
            cover_url,
            location,
            website_url

          })

      }
    );


  if (!result.success) {

    alert(
      result.message ||
      "پروفایل خوندي نه شو."
    );

    return;

  }


  const updatedUser =
    result.user ||
    result.data ||
    null;


  if (
    updatedUser
  ) {

    currentUser =
      {
        ...currentUser,
        ...updatedUser
      };

  } else {

    currentUser.name =
      name;

    currentUser.username =
      username;

    currentUser.bio =
      bio;

    currentUser.avatar_url =
      avatar_url;

    currentUser.cover_url =
      cover_url;

    currentUser.location =
      location;

    currentUser.website_url =
      website_url;

  }


  try {

    localStorage.setItem(
      "currentUser",
      JSON.stringify(
        currentUser
      )
    );

  } catch (error) {

    console.warn(
      "currentUser storage error:",
      error
    );

  }


  closeProfileEdit();


  alert(
    "پروفایل په بریالیتوب سره تازه شو. ✅"
  );


  await loadProfile(
    currentUser.id
  );

}

let currentFeedOffset = 0;
let currentFeedLimit = 20;

/* =====================================================
   LOAD FEED
   ===================================================== */

async function loadFeed(
  reset = true
) {

  const container =
    $("feedContainer") ||
    $("mainContent");


  if (!container) return;


  if (feedLoading) return;


  if (reset) {

    currentFeedOffset =
      0;

  }


  feedLoading =
    true;


  if (reset) {

    container.innerHTML = `

      <div
        class="card"
        style="
          padding:35px;
          text-align:center;
        "
      >

        <div
          style="
            font-size:38px;
          "

          ⏳
        </div>

        <div class="muted">
          پوسټونه لوډ کېږي...
        </div>

      </div>

    `;

  }


  try {

    const result =
      await apiRequest(
        `/feed?limit=${currentFeedLimit}&offset=${currentFeedOffset}`,
        {
          method:"GET"
        }
      );


    if (!result.success) {

      if (reset) {

        container.innerHTML = `

          <div
            class="card"
            style="
              padding:35px;
              text-align:center;
            "
          >

            <div
              style="
                font-size:45px;

            </div>

            </h3>

            <p class="muted">
              ${escapeHTML(
                result.message ||
                "د پوسټونو ترلاسه کولو کې ستونزه."
              )}
            </p>

            <button
              type="button"
              class="btn"
              onclick="
                loadFeed(true)
              "
            >
              بیا هڅه
            </button>

          </div>

        `;

      }


      return;

    }


    const posts =
      Array.isArray(
        result.posts
      )
        ? result.posts
        : Array.isArray(
            result.data
          )
          ? result.data
          : Array.isArray(
              result.results
            )
            ? result.results
            : [];


    if (reset) {

      container.innerHTML = "";

    }


    if (!posts.length) {

      if (reset) {

        container.innerHTML = `

          <div
            class="card"
            style="
              padding:50px 20px;
              text-align:center;
            "
          >

            <div

            </p>

          </div>

        `;

      }


      return;

    }


    const html =
      posts
        .map(
          post =>
            renderPostCard(
              post
            )
        )
        .join("");


    if (reset) {

      container.innerHTML =
        html;

    } else {

      container.insertAdjacentHTML(
        "beforeend",
        html
      );

    }


    currentFeedOffset +=
      posts.length;


    renderFeedLoadMoreButton(
      container,
      posts.length >=
        currentFeedLimit
    );


  } catch (
    error
  ) {

    console.error(
      "loadFeed error:",
      error
    );


    if (reset) {

      container.innerHTML = `

        <div

          style="
            padding:35px;
            text-align:center;
          "
        >

          <div
            style="
              font-size:42px;

          <button
            type="button"
            class="btn"
            onclick="
              loadFeed(true)
            "
          >
            بیا هڅه
          </button>

        </div>

      `;

    }

  } finally {

    feedLoading =
      false;

  }

}


/* =====================================================
   POST CARD
   ===================================================== */

function renderPostCard(
  post
) {

  const postId =
    post.id ||
    post.post_id;


  const authorId =
    post.user_id ||
    post.author_id ||
    post.owner_id;


  const authorName =
    post.author_name ||
    post.user_name ||
    post.name ||
    post.username ||
    "کاروونکی";


  const username =
    post.username ||
    "";


  const avatar =
    post.avatar_url ||
    post.author_avatar ||
    post.user_avatar ||
    post.avatar ||
    "";


  const content =
    post.content ||
    post.text ||
    "";


  const mediaUrl =
    post.media_url ||
    post.image_url ||
    post.photo_url ||
    "";


  const createdAt =
    post.created_at ||
    post.published_at ||
    "";


  const likes =
    Number(
      post.likes_count ||
      post.like_count ||
      post.likes ||
      0
    );


  const comments =
    Number(
      post.comments_count ||
      post.comment_count ||
      post.comments ||
      0
    );


  const shares =
    Number(
      post.shares_count ||
      post.share_count ||
      post.shares ||
      0
    );


  const isLiked =
    Number(
      post.is_liked ||
      post.user_liked ||
      0
    ) === 1 ||

   ===================================================== */

async function togglePostReaction(
  postId,
  button
) {

  if (!currentUser) {

    alert(
      "لومړی Login وکړئ."
    );

    return;

  }


  if (!postId) return;


  const alreadyLiked =
    button &&
    button.textContent.includes(
      "❤️"
    );


  if (button) {

    button.disabled =
      true;

  }


  const endpoint =
    alreadyLiked
      ? `/posts/${Number(postId)}/reaction`
      : `/posts/${Number(postId)}/reaction`;


  const result =
    await apiRequest(
      endpoint,
      {

        method:
          alreadyLiked
            ? "DELETE"
            : "POST",

        body:
          alreadyLiked
            ? undefined
            : JSON.stringify({
                reaction_type:
                  "like"
              })

      }
    );


  if (!result.success) {

    if (button) {

      button.disabled =
        false;

    }


    alert(
      result.message ||
      "Reaction ترسره نه شو."
    );

    return;

  }


  if (button) {

    button.disabled =
      false;


    button.innerHTML =
      alreadyLiked
        ? "♡ خوښول"
        : "❤️ خوښول";


    button.style.color =
      alreadyLiked
        ? "#555"
        : "#e41e3f";

  }


  const countElement =
    $(
      `like-count-${Number(postId)}`
    );


  if (countElement) {

    const oldCount =
      Number(
        countElement.textContent ||
        0
      );


    countElement.textContent =
      Math.max(
        0,
        oldCount +
          (
            alreadyLiked
              ? -1
              : 1
          )
      );

  }

}

async function sharePost(
  postId
) {

  if (!postId) return;


  const shareURL =
    `${window.location.origin}${window.location.pathname}?post=${Number(postId)}`;


  try {

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          "سیدولي افغاني نړیواله ټولنیزه شبکه",

        text:
          "دا پوسټ وګورئ",

        url:
          shareURL

      });

    } else if (
      navigator.clipboard
    ) {

      await navigator.clipboard.writeText(
        shareURL
      );


      alert(
        "د پوسټ لینک کاپي شو. 🔗"
      );

    } else {

      prompt(
        "د پوسټ لینک:",
        shareURL
      );

    }

  } catch (
    error
  ) {

    console.log(
      "Share cancelled:",
      error
    );

  }

}

/* =====================================================
   OPEN CONVERSATION
   ===================================================== */

async function openConversation(
  conversationId
) {

  if (!conversationId) return;


  activeConversationId =
    Number(conversationId);


  document
    .querySelectorAll(
      ".conversation-item"
    )
    .forEach(
      element => {

        const id =
          Number(
            element.dataset
              .conversationId
          );


        element.style.background =
          id ===
          activeConversationId
            ? "#e7f0ff"
            : "white";

      }
    );


  const conversation =
    conversationsCache.find(
      item =>
        Number(
          item.id ||
          item.conversation_id
        ) ===
        activeConversationId
    );


  updateChatHeader(
    conversation
  );


  const composer =
    $("messageComposer");


  if (composer) {

    composer.style.display =
      "block";

  }


  await loadConversationMessages(
    activeConversationId
  );


  startMessagesRefresh();

}

async function loadConversationMessages(

) {

/* =====================================================
   RENDER MESSAGES
   ===================================================== */

function renderMessages(
  messages
) {

  const container =
    $("messagesList");


  if (!container) return;


  if (!messages.length) {

    container.innerHTML = `

        style="

/* =====================================================
   MESSAGE BUBBLE
   ===================================================== */

function renderMessageBubble(
  message
) {

  const id =
    message.id ||
    message.message_id;


  const senderId =
    message.sender_id ||
    message.user_id ||
    message.from_user_id;


  const content =
    message.content ||
    message.message ||
    message.text ||
    "";


  const createdAt =

    message.sent_at ||
    "";


  const isMine =

  return `

              ? "4px 16px"

/* =====================================================
   SEND CURRENT MESSAGE
   ===================================================== */

async function sendCurrentMessage() {

  if (
    !activeConversationId
  ) {

    return;

  }


  if (!currentUser) {

    alert(
      "لومړی Login وکړئ."
    );

    return;

  }


  const input =
    $("messageInput");


  if (!input) return;


  const content =
    input.value.trim();


  if (!content) {

    return;

  }


  const button =
    document.querySelector(
      "#messageComposer button"
    );


  if (button) {

    button.disabled =
      true;

  }


  const result =
    await apiRequest(
      `/conversations/${Number(activeConversationId)}/messages`,
      {

        method:
          "POST",

        body:
          JSON.stringify({

            content:
              content

        })

      }
    );


  if (button) {

    button.disabled =
      false;

  }


  if (!result.success) {

    alert(
      result.message ||
      "پیغام ونه لېږل شو."
    );

    return;

  }


  input.value =
    "";


  await loadConversationMessages(
    activeConversationId
  );


  await loadConversations();

}


/* =====================================================
   KEYBOARD
   ===================================================== */

function handleMessageKeydown(
  event
) {

  if (
    event.key ===
    "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();


    sendCurrentMessage();

  }

}


/* =====================================================
   MARK READ
   ===================================================== */

async function markConversationRead(
  conversationId
) {

  if (!conversationId) return;


  try {

    await apiRequest(
      `/conversations/${Number(conversationId)}/read`,
      {
        method:"POST"
      }
    );

  } catch (
    error
  ) {

    console.warn(
      "markConversationRead:",
      error
    );

  }

}


/* =====================================================
   START PRIVATE CONVERSATION
   ===================================================== */

async function startPrivateConversation(
  userId,
  userName = ""
) {

  if (!currentUser) {

    alert(
      "لومړی Login وکړئ."
    );

    return;

  }


  if (
    Number(userId) ===
    Number(currentUser.id)
  ) {

    alert(
      "له خپل ځان سره خبرې نه شئ پیلولی."
    );

    return;

  }


  const result =
    await apiRequest(
      "/conversations",
      {

        method:
          "POST",

        body:
          JSON.stringify({

            user_id:
              Number(userId)

        })

      }
    );


  if (!result.success) {

    alert(
      result.message ||
      "خبرې اترې جوړې نه شوې."
    );

    return;

  }


  const conversation =
    result.conversation ||
    result.data;


  if (
    conversation &&
    conversation.id
  ) {

    await loadMessagesPage();


    await openConversation(
      conversation.id
    );

    return;

  }


  /*
    که Worker د conversation ID
    په بل نوم راولي
  */

  const conversationId =
    result.conversation_id ||
    result.id;


  if (conversationId) {

    await loadMessagesPage();


    await openConversation(
      conversationId
    );

    return;

  }


  await loadMessagesPage();


  if (userName) {

    console.log(
      "Conversation created with:",
      userName
    );

  }

}


/* =====================================================
   FILTER CONVERSATIONS
   ===================================================== */

function filterConversations(
  query
) {

  const q =
    String(
      query || ""
    )
      .trim()
      .toLowerCase();


  if (!q) {

    renderConversations(
      conversationsCache
    );

    return;

  }


  const filtered =
    conversationsCache.filter(
      conversation => {

        const text =
          [

            conversation.other_user_name,
            conversation.user_name,
            conversation.name,
            conversation.username,
            conversation.title,
            conversation.last_message

          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


        return text.includes(
          q
        );

      }
    );


  renderConversations(
    filtered
  );

}


/* =====================================================
   MESSAGE AUTO REFRESH
   ===================================================== */

function startMessagesRefresh() {

  stopMessagesRefresh();


  messagesRefreshTimer =
    setInterval(
      async function() {

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        if (
          activeConversationId &&
          $("messagesList")
        ) {

          await loadConversationMessages(
            activeConversationId
          );

        }

      },
      10000
    );

}


function stopMessagesRefresh() {

  if (
    messagesRefreshTimer
  ) {

    clearInterval(
      messagesRefreshTimer
    );

    messagesRefreshTimer =
      null;

  }

}


/* =====================================================
   NAVIGATION
   ===================================================== */

document.addEventListener(
  "click",
  function(event) {

    const target =
      event.target.closest(
        "[data-nav='messages']"
      );


    if (!target) return;


    event.preventDefault();


    loadMessagesPage();

  }
);


/* =====================================================
   PAGE CLEANUP
   ===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState !==
      "visible"
    ) {

      stopMessagesRefresh();

    } else if (
      activeConversationId
    ) {

      startMessagesRefresh();

    }

  }
);


/* =====================================================
   GLOBAL EXPORTS
   ===================================================== */

window.loadMessagesPage =
  loadMessagesPage;

window.loadConversations =
  loadConversations;

window.openConversation =
  openConversation;

window.loadConversationMessages =
  loadConversationMessages;

window.sendCurrentMessage =
  sendCurrentMessage;

window.startPrivateConversation =
  startPrivateConversation;

window.filterConversations =
  filterConversations;

window.handleMessageKeydown =
  handleMessageKeydown;

window.markConversationRead =
  markConversationRead;

window.startMessagesRefresh =
  startMessagesRefresh;

window.stopMessagesRefresh =
  stopMessagesRefresh;

);

/* =====================================================

function getNotificationIcon(
  type
) {

  const t =
    String(
      type || ""
    ).toLowerCase();


  if (
    t.includes("friend")
  ) {

    return "👥";

  }


  if (
    t.includes("like") ||
    t.includes("reaction")
  ) {

    return "❤️";

  }


  if (
    t.includes("comment")
  ) {

    return "💬";

  }


  if (
    t.includes("message")
  ) {

    return "✉️";

  }


  if (
    t.includes("share")
  ) {

    return "↗️";

  }


  if (
    t.includes("follow")
  ) {

    return "➕";

  }


  return "🔔";

}

    String(
      type || ""

    t.includes("friend_request")
  ) {

    return "د ملګرتیا غوښتنه درولېږل شوه.";

/* =====================================================
   MARK ONE NOTIFICATION READ
   ===================================================== */

async function markNotificationRead(
  notificationId
) {

  if (!notificationId) return;


  const result =
    await apiRequest(
      `/notifications/${Number(notificationId)}/read`,
      {
        method:"POST"
      }
    );


  if (!result.success) {

    console.warn(
      "Notification read:",
      result.message
    );

    return;

  }


  const notification =
    notificationsCache.find(
      item =>
        Number(
          item.id ||
          item.notification_id
        ) ===
        Number(notificationId)
    );


  if (notification) {

    notification.is_read =
      1;

    notification.read =
      true;

  }


  updateNotificationBadge(
    notificationsCache
  );

}


/* =====================================================
   MARK ALL READ
   ===================================================== */

async function markAllNotificationsRead() {

  const unread =
    notificationsCache.filter(
      notification => {

        return !(
          Number(
            notification.is_read ||
            notification.read ||
            0
          ) === 1 ||
          notification.is_read === true ||
          notification.read === true
        );

      }
    );


  if (!unread.length) {

    alert(
      "ټولې خبرتیاوې لا دمخه لوستل شوې دي."
    );

    return;

  }


  for (
    const notification
    of unread
  ) {

    const id =
      notification.id ||
      notification.notification_id;


    if (!id) continue;


    await apiRequest(
      `/notifications/${Number(id)}/read`,
      {
        method:"POST"
      }
    );


    notification.is_read =
      1;

    notification.read =
      true;

  }


  renderNotifications(
    notificationsCache
  );


  updateNotificationBadge(
    notificationsCache
  );

}

   NOTIFICATION CLICK
   ===================================================== */

  notificationId,
  type,
  postId,
  userId
) {

  await markNotificationRead(
    notificationId

  const item =
    document.querySelector(

  if (item) {

  if (

  if (

  }


  if (
    t.includes("friend")
  ) {

    loadEnhancedFriendsPage();

  }

}


/* =====================================================
   NOTIFICATION BADGE
   ===================================================== */

function updateNotificationBadge(
  notifications
) {

  const list =
    Array.isArray(
      notifications
    )
      ? notifications
      : [];


  const unreadCount =
    list.filter(
      notification => {

        return !(
          Number(
            notification.is_read ||
            notification.read ||
            0
          ) === 1 ||
          notification.is_read === true ||
          notification.read === true
        );

      }
    ).length;


  const selectors = [

    "#notificationBadge",
    "#notificationsBadge",
    ".notification-badge",
    "[data-notification-badge]"

  ];


  selectors.forEach(
    selector => {

      document
        .querySelectorAll(
          selector
        )
        .forEach(
          badge => {

            if (
              unreadCount > 0
            ) {

              badge.textContent =
                unreadCount > 99
                  ? "99+"
                  : String(
                      unreadCount
                    );

              badge.style.display =
                "inline-flex";

            } else {

              badge.textContent =
                "";

              badge.style.display =
                "none";

            }

          }
        );

    }
  );


  document
    .querySelectorAll(
      "[data-nav='notifications']"
    )
    .forEach(
      element => {

        element.setAttribute(
          "data-unread",
          String(
            unreadCount
          )
        );

      }
    );

}


/* =====================================================
   NOTIFICATION AUTO REFRESH
   ===================================================== */

let notificationRefreshTimer =
  null;


function startNotificationRefresh() {

  stopNotificationRefresh();


  notificationRefreshTimer =
    setInterval(
      async function() {

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        if (
          currentUser
        ) {

          await refreshNotificationBadge();

        }

      },
      15000
    );

}


function stopNotificationRefresh() {

  if (
    notificationRefreshTimer
  ) {

    clearInterval(
      notificationRefreshTimer
    );

    notificationRefreshTimer =
      null;

  }

}

            result.results

  );

async function findUserFromSearch(
  userId

  try {

    const result =
      await apiRequest(
        `/users/search?q=${encodeURIComponent(
          String(userId)
        )}`,
        {
          method:"GET"
        }
      );


    if (
      !result ||
      !result.success
    ) {

      return null;

    const users =
      Array.isArray(
        result.users
      )
        ? result.users
        : Array.isArray(
            result.data
          )
          ? result.data
          : [];


    return (
      users.find(
        user =>
          Number(
            user.id ||
            user.user_id
          ) ===
          Number(userId)
      ) ||
      null
    );

  } catch (
    error
  ) {

    console.warn(
      "findUserFromSearch:",
      error
    );

    return null;

  }

  const status =
    $("editProfileStatus");


  if (!name) {

    }

    return;

  }


  if (status) {

    status.textContent =
      "⏳ معلومات خوندي کېږي...";

  }


  const result =
    await apiRequest(
      "/profile",
      {

        method:
          "PUT",

        body:
          JSON.stringify({

            name:
              name,

            username:
              username,

            bio:
              bio,

            location:
              location,

            phone:
              phone,

            website_url:
              website

          })

      }
    );


  if (!result.success) {

    if (status) {

      status.textContent =
        "❌ " +
        (
          result.message ||
          "معلومات خوندي نه شول."
        );

    }

    return;

  }


  const updated =
    result.user ||
    result.profile ||
    result.data;


  if (
    updated &&
    currentUser
  ) {

    Object.assign(
      currentUser,
      updated
    );

  } else {

    if (currentUser) {

      currentUser.name =
        name;

      currentUser.username =
        username;

      currentUser.bio =
        bio;

      currentUser.location =
        location;

      currentUser.phone =
        phone;

      currentUser.website_url =
        website;

    }

  }


  closeEditProfile();


  await loadProfile(
    currentUser.id
  );


  alert(
    result.message ||

  );

}

   ===================================================== */

function handleGlobalSearchInput(
  value
) {

  clearTimeout(
    searchTimer
  );


  const q =
    String(
      value || ""
    ).trim();


  const status =
    $("searchStatus");


  if (!q) {

    if (status) {

      status.textContent =
        "";

    }


    const results =
      $("searchResults");


    if (results) {

      results.innerHTML = `

        <div
          style="
            padding:35px;
            text-align:center;

        >

          <div
            style="
              font-size:45px;

    return;

  }


  searchTimer =
    setTimeout(
      function() {

        performGlobalSearch(
          q
        );

      },
      450
    );

   ===================================================== */

async function performGlobalSearch(
  query
) {

  const q =
    String(
      query || ""

  const results =
    $("searchResults");


  const status =
    $("searchStatus");


  if (!results) return;


  if (!q) {

    results.innerHTML = `

  if (status) {

  results.innerHTML = `

      style="
        padding:30px;
        text-align:center;

      ⏳ کاروونکي پیدا کېږي...

  `;


  const result =
    await apiRequest(
      `/users/search?q=${encodeURIComponent(q)}`,
      {
        method:"GET"
      }
    );


  if (!result || !result.success) {

    if (status) {

      status.textContent =
        "لټون ناکام شو.";

    }


    results.innerHTML = `

      <div
        style="

  searchUsersCache =

      `${users.length} کاروونکي پیدا شول.`;

/* =====================================================
   QUICK SEARCH
   ===================================================== */

async function quickSearchUsers(
  query
) {

  const q =
    String(
      query || ""
    ).trim();


  if (!q) {

    return [];

  }


  const result =
    await apiRequest(
      `/users/search?q=${encodeURIComponent(q)}`,
      {
        method:"GET"
      }
    );


  if (
    !result ||
    !result.success
  ) {

    return [];

  }


  const users =
    Array.isArray(
      result.users
    )
      ? result.users
      : Array.isArray(
          result.data
        )
        ? result.data
        : [];


  return users;

}


/* =====================================================
   SEARCH DROPDOWN
   ===================================================== */

function createSearchDropdown() {

  if (
    $("headerSearchDropdown")
  ) {

    return;

  }


  const input =
    document.querySelector(
      "#globalSearch, #searchInput, [data-global-search]"
    );


  if (!input) return;


  const parent =
    input.parentElement;


  if (!parent) return;


  parent.style.position =
    "relative";


  const dropdown =
    document.createElement(
      "div"
    );


  dropdown.id =
    "headerSearchDropdown";


  dropdown.style.cssText = `
    position:absolute;
    top:calc(100% + 5px);
    right:0;
    left:0;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    z-index:9999;
    display:none;
    max-height:400px;
    overflow:auto;
  `;


  parent.appendChild(
    dropdown
  );


  input.addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      const q =
        this.value.trim();


      if (!q) {

        dropdown.style.display =
          "none";

        return;

      }


      searchTimer =
        setTimeout(
          async function() {

            dropdown.innerHTML = `

              <div
                style="
                  padding:15px;
                  text-align:center;
                "
              >
                ⏳
              </div>

            `;

            dropdown.style.display =
              "block";


            const users =
              await quickSearchUsers(
                q
              );


            if (!users.length) {

              dropdown.innerHTML = `

                <div
                  style="
                    padding:18px;
                    text-align:center;
                  "
                >
                  👤 نتیجه نشته
                </div>

              `;

              return;

            }


            dropdown.innerHTML =
              users
                .slice(
                  0,
                  8
                )
                .map(
                  user =>
                    renderDropdownUser(
                      user
                    )
                )
                .join("");

          },
          400
        );

    }
  );


  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();


        dropdown.style.display =
          "none";


        openSearchFromHeader(
          input.value
        );

      }

    }
  );


  document.addEventListener(
    "click",
    function(event) {

      if (
        !parent.contains(
          event.target
        )
      ) {

        dropdown.style.display =
          "none";

      }

    }
  );

}

   SEND CURRENT MESSAGE
   ===================================================== */

async function sendCurrentMessage() {

  if (!activeConversationId) {

    alert(
      "لومړی یوه خبرې وټاکئ."
    );

    return;

  }


  const input =
    $("messageInput");


  if (!input) return;


  const text =
    input.value.trim();


  if (!text) return;


  const button =
    $("sendMessageButton");


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "⏳";

  }


  const result =
    await apiRequest(
      `/conversations/${Number(
        activeConversationId
      )}/messages`,
      {

        method:
          "POST",

        body:
          JSON.stringify({

            content:
              text

          })

      }
    );


  if (!result.success) {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "لېږل";

    }


    alert(
      result.message ||
      "پیغام ونه لېږل شو."
    );

    return;

  }


  input.value =
    "";


  if (button) {

    button.disabled =
      false;

    button.textContent =
      "لېږل";

  }


  await loadMessages(
    activeConversationId
  );


  await loadConversations(
    true
  );

async function createConversationWithUser(

) {

) {

          getConversationUser(
            conversation

        return Number(
          user.id
        ) ===
        Number(userId);

  if (existing) {

      existing.id ||
      existing.conversation_id;


    loadMessagesPage(
      id

    return;

  }


  const conversationId =
    await createConversationWithUser(
      userId,
      userName
    );


  if (!conversationId) {

    return;

  }


  loadMessagesPage(
    conversationId
  );

/* =====================================================
   READ NOTIFICATION
   ===================================================== */

async function markNotificationRead(
  notificationId
) {

  if (!notificationId) {

    return false;

  }


  const result =
    await apiRequest(
      `/notifications/${Number(
        notificationId
      )}/read`,
      {

        method:
          "POST"

      }
    );


  if (
    !result ||
    !result.success
  ) {

    return false;

  }


  const notification =
    notificationsCache.find(
      item =>
        Number(
          item.id ||
          item.notification_id
        ) ===
        Number(
          notificationId
        )
    );


  if (notification) {

    notification.is_read =
      1;

    notification.read =
      1;

  }


  const element =
    document.getElementById(
      `notification-${Number(
        notificationId
      )}`
    );


  if (element) {

    element.style.background =
      "#fff";

    const dot =
      element.querySelector(
        "span"
      );

    if (dot) {

      dot.style.display =
        "none";

    }

  }


  updateNotificationBadges(
    notificationsCache
  );


  return true;

}


/* =====================================================
   MARK ALL NOTIFICATIONS READ
   ===================================================== */

async function markAllNotificationsRead() {

  const notifications =
    Array.isArray(
      notificationsCache
    )
      ? notificationsCache
      : [];


  if (!notifications.length) {

    return;

  }


  let changed =
    false;


  for (
    const notification
    of notifications
  ) {

    const id =
      notification.id ||
      notification.notification_id;


    const isRead =
      Number(
        notification.is_read ||
        notification.read ||
        0
      ) === 1 ||
      notification.is_read === true ||
      notification.read === true;


    if (
      !isRead &&
      id
    ) {

      const success =
        await markNotificationRead(
          id
        );


      if (success) {

        changed =
          true;

      }

    }

  }


  if (changed) {

    await loadNotifications(
      true
    );

  }

}


/* =====================================================
   HANDLE NOTIFICATION CLICK
   ===================================================== */

async function handleNotificationClick(
  notificationId,
  type,
  targetId
) {

  await markNotificationRead(
    notificationId
  );


  const value =
    String(
      type || ""
    ).toLowerCase();


  if (
    value.includes(
      "message"
    )
  ) {

    loadMessagesPage();

    return;

  }


  if (
    targetId
  ) {

    if (
      value.includes(
        "comment"
      ) ||
      value.includes(
        "like"
      ) ||
      value.includes(
        "reaction"
      ) ||
      value.includes(
        "share"
      ) ||
      value.includes(
        "post"
      )
    ) {

      if (
        typeof loadPostDetails ===
        "function"
      ) {

        loadPostDetails(
          Number(targetId)
        );

        return;

      }


      if (
        typeof openPost ===
        "function"
      ) {

        openPost(
          Number(targetId)
        );

        return;

      }

    }

  }


  if (
    value.includes(
      "friend"
    ) ||
    value.includes(
      "request"
    )
  ) {

    loadFriendsPage();

    return;

  }


  if (
    value.includes(
      "mention"
    )
  ) {

    if (
      targetId &&
      typeof loadPostDetails ===
      "function"
    ) {

      loadPostDetails(
        Number(targetId)
      );

    }

  }

}


/* =====================================================
   NOTIFICATION BADGES
   ===================================================== */

function updateNotificationBadges(
  notifications
) {

  const list =
    Array.isArray(
      notifications
    )
      ? notifications
      : [];


  const unreadCount =
    list.filter(
      notification => {

        return !(
          Number(
            notification.is_read ||
            notification.read ||
            0
          ) === 1 ||

        );

/* =====================================================
   GET UNREAD NOTIFICATIONS COUNT
   ===================================================== */

async function getUnreadNotificationsCount() {

  const result =
    await apiRequest(
      "/notifications",
      {
        method:"GET"
      }
    );


  if (
    !result ||
    !result.success
  ) {

    return 0;

  }


  const notifications =
    Array.isArray(
      result.notifications
    )
      ? result.notifications
      : Array.isArray(
          result.data
        )
        ? result.data
        : [];


  return notifications.filter(
    notification => {

      return !(
        Number(
          notification.is_read ||
          notification.read ||
          0
        ) === 1 ||
        notification.is_read === true ||
        notification.read === true
      );

    }
  ).length;

}

async function saveProfileChanges(
  event
) {

  event.preventDefault();


  if (!currentUser) {

    alert(
      "Session ختم شوی. بیا Login وکړئ."
    );

    return;

  }


  const name =
    $("profileName")?.value.trim();


  const username =
    $("profileUsername")?.value.trim();


  const bio =
    $("profileBio")?.value.trim();


  const avatar_url =
    $("profileAvatar")?.value.trim();


  const cover_url =
    $("profileCover")?.value.trim();


  const location =
    $("profileLocation")?.value.trim();


  const website_url =
    $("profileWebsite")?.value.trim();


  const phone =
    $("profilePhone")?.value.trim();


  const email =
    $("profileEmail")?.value.trim();


  if (!name) {

    alert(
      "نوم ضروري دی."
    );

    return;

  }


  const button =
    document.querySelector(
      "#profileEditForm button[type='submit']"
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "⏳ ساتل کېږي...";

  }


  const body = {

    name,

    username,

    bio,

    avatar_url,

    cover_url,

    location,

    website_url,

    phone,

    email

  };


  const result =
    await apiRequest(
      "/profile",
      {

        method:
          "PUT",

        body:
          JSON.stringify(
            body
          )

      }
    );


  if (button) {

    button.disabled =
      false;

    button.textContent =
      "💾 بدلون ساتل";

  }


  if (
    !result ||
    !result.success
  ) {

    alert(
      result?.message ||
      "پروفایل تازه نه شو."
    );

    return;

  }


  const updatedUser =
    result.user ||
    result.profile ||
    result.data;


  if (updatedUser) {

    currentUser =
      {
        ...currentUser,
        ...updatedUser
      };

  } else {

    currentUser =
      {
        ...currentUser,
        ...body
      };

  }


  profileEditMode =
    false;


  alert(
    "✓ پروفایل په بریالیتوب تازه شو."
  );


  loadProfile(
    currentUser.id
  );

}

/* =====================================================

   ===================================================== */

function updatePostLikeUI(
  postId,
  result
) {

  const article =
    document.getElementById(
      `post-${Number(
        postId
      )}`
    );


  if (!article) return;


  const liked =
    result.liked === true ||
    Number(
      result.is_liked
    ) === 1;


  const count =
    Number(
      result.likes_count ??
      result.like_count ??
      result.likes ??
      0
    );


  const counters =
    article.querySelectorAll(
      "div"
    );


  let found =
    false;


  counters.forEach(
    element => {

      if (
        element.textContent
          .trim()
          .startsWith("👍")
      ) {

        element.textContent =
          `👍 ${count}`;

        found =
          true;

      }

    }
  );


  const buttons =
    article.querySelectorAll(
      "button"
    );


  buttons.forEach(
    button => {

      if (
        button.textContent
          .includes("Like") ||
        button.textContent
          .includes("خوښ")
      ) {

        button.textContent =
          liked
            ? "👍 خوښ شو"
            : "👍 Like";

      }

    }
  );

}

/* =====================================================

   ===================================================== */

function formatPostDate(
  value
) {

  if (!value) return "";


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return escapeHTML(
      String(value)
    );

  }


  return date.toLocaleString(
    "ps-AF",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

async function sendMessage(
  conversationId
) {

  if (!currentUser) {

    alert(
      "لومړی Login وکړئ."
    );

    return;

  }


  const input =
    $("messageInput");


  if (!input) return;


  const content =
    input.value.trim();


  if (!content) return;


  const result =
    await apiRequest(
      `/conversations/${Number(
        conversationId
      )}/messages`,
      {

        method:
          "POST",

        body:
          JSON.stringify({

            content

          })

      }
    );


  if (
    !result ||
    !result.success
  ) {

    alert(
      result?.message ||
      "پیغام ونه لېږل شو."
    );

    return;

  }


  input.value =
    "";


  await loadMessages(
    conversationId
  );


  await loadConversations();

}

   ===================================================== */

async function startPrivateConversation(

) {

   ===================================================== */

function startMessageRefresh() {

  stopMessageRefresh();


  messageRefreshTimer =
    setInterval(
      async function() {

        if (
          !activeConversationId
        ) {

          return;

        }


        const list =
          $("messageList");


        if (!list) return;


        await loadMessages(
          activeConversationId
        );

      },
      5000
    );

}


function stopMessageRefresh() {

  if (
    messageRefreshTimer
  ) {

    clearInterval(
      messageRefreshTimer
    );

    messageRefreshTimer =
      null;

  }

}

   ===================================================== */

async function openNotification(
  notificationId,
  url = ""
) {

  await markNotificationRead(
    notificationId
  );


  if (url) {

    try {

      const parsed =
        new URL(
          url,
          window.location.origin
        );


      if (
        parsed.origin ===
        window.location.origin
      ) {

        window.location.href =
          parsed.href;

        return;

      }

    } catch (e) {

      console.warn(
        "Invalid notification URL",
        e
      );

    }

  }


  await fetchNotifications();

}

          badge.style.display =

let sessionCheckTimer = null;


/* =====================================================
   CHECK CURRENT SESSION
   ===================================================== */

async function checkCurrentSession() {

  try {

    const result =
      await apiRequest(
        "/me",
        {
          method:"GET"
        }
      );


    if (
      result &&
      result.success &&
      result.user
    ) {

      currentUser =
        result.user;


      window.currentUser =
        currentUser;


      updateLoggedInUI();


      return currentUser;

    }


    currentUser =
      null;


    window.currentUser =
      null;


    updateLoggedOutUI();


    return null;

  } catch (error) {

    console.warn(
      "Session check error:",
      error
    );


    return null;

  }

}


/* =====================================================
   LOGIN FORM
   ===================================================== */

async function performLogin(
  identifier,
  password
) {

  identifier =
    String(
      identifier || ""
    ).trim();


  password =
    String(
      password || ""
    );


  if (
    !identifier ||
    !password
  ) {

    alert(
      "Username/Email او Password ولیکئ."
    );

    return false;

  }


  const result =
    await apiRequest(
      "/login",
      {

        method:
          "POST",

        body:
          JSON.stringify({

            identifier:
              identifier,

            password:
              password

          })

      }
    );


  if (
    !result ||
    !result.success
  ) {

    alert(
      result?.message ||
      "Login ناکام شو."
    );

    return false;

  }


  currentUser =
    result.user ||
    result.data?.user ||
    null;


  window.currentUser =
    currentUser;


  if (
    result.token
  ) {

    localStorage.setItem(
      "saidwali_token",
      result.token
    );

  }


  if (
    result.session_token
  ) {

    localStorage.setItem(
      "saidwali_token",
      result.session_token
    );

  }


  updateLoggedInUI();


  startSessionCheck();


  startNotificationRefresh();


  alert(
    "✓ Login په بریالیتوب ترسره شو."
  );


  return true;

}

   LOGOUT
   ===================================================== */

async function performLogout() {

  try {

    await apiRequest(
      "/logout",
      {
        method:"POST"
      }
    );

  } catch (error) {

    console.warn(
      "Logout request error:",
      error
    );

  }


  localStorage.removeItem(
    "saidwali_token"
  );


  localStorage.removeItem(
    "token"
  );


  sessionStorage.removeItem(
    "saidwali_token"
  );


  currentUser =
    null;


  window.currentUser =
    null;


  stopSessionCheck();


  stopNotificationRefresh();


  updateLoggedOutUI();


  alert(
    "✓ Logout وشو."
  );

}

  if (!file.type.startsWith("image/")) {

  if (file.size > 5 * 1024 * 1024) {

    return false;
  }

  const form =
    new FormData();

  form.append(
    "avatar",
    file
  );

  const result =
    await apiRequest(
      "/profile/avatar",
      {
        method:"POST",
        body:form
      }
    );

  if (
    !result ||
    !result.success
  ) {

    alert(
      result?.message ||
      "پروفایل عکس بدل نه شو."
    );

    return false;
  }

  const user =
    result.user ||
    result.data?.user ||
    result.data ||
    {};

  currentUser = {
    ...currentUser,
    ...user
  };

  window.currentUser =
    currentUser;

  updateLoggedInUI();

  alert(
    "✓ پروفایل عکس بدل شو."
  );

  return true;
}

  file
) {

  if (!currentUser) {
    alert("لومړی Login وکړئ.");
    return false;
  }

  if (!file) return false;

  if (!file.type.startsWith("image/")) {
    alert("یوازې د عکس فایل انتخاب کړئ.");
    return false;
  }

  if (file.size > 8 * 1024 * 1024) {
    alert("د Cover عکس اندازه باید له 8MB کمه وي.");
    return false;
  }

  const form =
    new FormData();

  form.append(
    "cover",
    file
  );

  const result =
    await apiRequest(
      "/profile/cover",
      {
        method:"POST",
        body:form
      }
    );

  if (
    !result ||
    !result.success
  ) {

    alert(
      result?.message ||
      "Cover عکس بدل نه شو."
    );

    return false;
  }

  const user =
    result.user ||
    result.data?.user ||
    result.data ||
    {};

  currentUser = {
    ...currentUser,
    ...user
  };

  window.currentUser =
    currentUser;

  updateLoggedInUI();

  alert(
    "✓ Cover عکس بدل شو."
  );

  return true;
}

/* =====================================================

const API_BASE =
  "https://saidwali-social-api.walizaad2.workers.dev";

let sessionToken =
  localStorage.getItem("saidwali_session_token") || "";


/* API */

async function apiRequest(endpoint, options = {}) {

  try {

    const headers = {
      "Content-Type": "application/json",
      ...(options.headers || {})
    };

    if (sessionToken) {
      headers["Authorization"] =
        "Bearer " + sessionToken;
    }

    const response = await fetch(
      API_BASE + endpoint,
      {
        ...options,
        headers
      }
    );

    const data = await response.json();

    return data;

  } catch (error) {

    console.error(error);

    return {
      success: false,
      message: "له Worker سره اړیکه ونه شوه."
    };

  }
}

/* REGISTER */

async function registerUser() {

  const fullName =
    document
      .getElementById("registerFullName")
      ?.value
      .trim();

  const username =
    document
      .getElementById("registerUsername")
      ?.value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      ?.value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      ?.value;


  if (!fullName ||
      !username ||
      !email ||
      !password) {

    alert("ټول معلومات ډک کړه.");

    return;
  }


  const result =
    await apiRequest(
      "/register",
      {
        method: "POST",

        body: JSON.stringify({

          full_name: fullName,

          username: username,

          email: email,

          password: password

        })

      }
    );


  if (!result.success) {

    alert(
      result.message ||
      "حساب جوړ نه شو."
    );

    return;
  }


  sessionToken =
    result.token || "";

  localStorage.setItem(
    "saidwali_session_token",
    sessionToken
  );


  alert(
    result.message ||
    "حساب جوړ شو."
  );


  await startApplication();

}


/* LOGIN */

async function loginUser() {

  const identifier =
    document
      .getElementById("loginIdentifier")
      ?.value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      ?.value;


  if (!identifier || !password) {

    alert(
      "Username/Email او Password ولیکه."
    );

    return;
  }


  const result =
    await apiRequest(
      "/login",
      {
        method: "POST",

        body: JSON.stringify({

          username: identifier,

          email: identifier,

          password: password

        })

      }
    );


  if (!result.success) {

    alert(
      result.message ||
      "Login ناکام شو."
    );

    return;
  }


  sessionToken =
    result.token ||
    result.session_token ||
    result.sessionToken ||
    result.data?.token ||
    "";


  if (!sessionToken) {

    alert(
      "Login وشو، خو Token پیدا نه شو."
    );

    return;
  }


  localStorage.setItem(
    "saidwali_session_token",
    sessionToken
  );


  await startApplication();

}


/* START */

async function startApplication() {

  const authPage =
    document.getElementById("authPage");

  const app =
    document.getElementById("app");


  if (authPage) {

    authPage.classList.add("hidden");

  }


  if (app) {

    app.classList.remove("hidden");

  }

}


/* AUTO LOGIN */

async function checkExistingSession() {

  if (!sessionToken) {

    return;

  }


  const result =
    await apiRequest("/me");


  if (result.success) {

    await startApplication();

  } else {

    sessionToken = "";

    localStorage.removeItem(
      "saidwali_session_token"
    );

  }

}

document.addEventListener(

  function () {

    checkExistingSession();

  }
);
