<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Afghan News Portal</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f6fa;
}

/* BACK BUTTON */
.back-btn{
position:fixed;
top:12px;
right:12px;
background:#ff9800;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-size:14px;
box-shadow:0 0 10px rgba(0,0,0,0.25);
z-index:9999;
}

.back-btn:hover{
background:#e68900;
}

/* HEADER */
header{
  background:#0b3d91;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

/* AUTO TICKER */
.ticker{
  background:red;
  color:white;
  padding:8px;
  white-space:nowrap;
  overflow:hidden;
}
.ticker span{
  display:inline-block;
  animation:move 12s linear infinite;
}
@keyframes move{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
  padding:15px;
}

/* VIDEO */
.video-box{
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.video-box iframe{
  width:320px;
  height:180px;
  border-radius:10px;
}

/* BOX */
.box{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.box h2{
  background:#222;
  color:white;
  padding:8px;
  border-radius:5px;
}

/* NEWS ITEM */
.item{
  display:flex;
  gap:10px;
  margin-top:10px;
  border-bottom:1px solid #eee;
  padding-bottom:10px;
}
.item img{
  width:120px;
  height:80px;
  border-radius:8px;
  object-fit:cover;
}

/* POST BOX */
.post-box textarea{
  width:100%;
  height:70px;
  padding:10px;
}
.post-box button{
  background:#0b3d91;
  color:white;
  border:none;
  padding:10px;
  margin-top:5px;
  width:100%;
  cursor:pointer;
  border-radius:5px;
}

/* POSTS */
.post{
  background:#fff8dc;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- BACK BUTTON -->
<a href="javascript:history.back()" class="back-btn">⬅ شاته</a>

<header>🌐 افغان Live News Portal</header>

<div class="ticker">
<span>🔴 BBC + زاویه + امارت + معارف + شخصي خبرونه هر څو ثانیې وروسته تازه کېږي...</span>
</div>

<div class="container">

<div class="box">
<h2>🎥 Live Videos</h2>
<div class="video-box">
<iframe src="https://www.youtube.com/embed/5qap5aO4i9A"></iframe>
<iframe src="https://www.youtube.com/embed/ScMzIvxBSi4"></iframe>
</div>
</div>

<div class="box">
<h2>BBC News</h2>
<div id="bbc"></div>
</div>

<div class="box">
<h2>زاویه نیوز</h2>
<div id="zawiya"></div>
</div>

<div class="box">
<h2>امارت نیوز</h2>
<div id="emarat"></div>
</div>

<div class="box">
<h2>معارف خبرونه</h2>
<div id="maaref"></div>
</div>

<div class="box">
<h2>ستاسو شخصي خبرونه</h2>

<div class="post-box">
<textarea id="text" placeholder="ددوکلام اوارندو داوبو مشکل په نیږدی ورځو کی دحل وړدی..."></textarea>
<button onclick="addPost()">نشر کړه</button>
</div>

<div id="posts"></div>

</div>

</div>

<script>

let bbcData = [
 "BBC تازه راپور: د افغانستان تعلیم",
 "BBC نړیوال خبرونه تازه شوي"
];

let zawiyaData = [
 "زاویه نیوز: سیاسي تازه خبر",
 "زاویه: اقتصادي راپور"
];

let emaratData = [
 "امارت خبر: رسمي اعلان خپور شو",
 "امارت تازه حکمونه"
];

let maarefData = [
 "معارف: نوي ښوونځي پرانیستل شول",
 "معارف: د زده کړو پروګرام"
];

function render(id, data){
 let box = document.getElementById(id);
 box.innerHTML = "";
 data.forEach(t=>{
  box.innerHTML += `
  <div class="item">
   <img src="https://via.placeholder.com/120">
   <div>${t}</div>
  </div>`;
 });
}

function refreshAll(){
 render("bbc", bbcData);
 render("zawiya", zawiyaData);
 render("emarat", emaratData);
 render("maaref", maarefData);
}

refreshAll();
setInterval(refreshAll, 5000);

function addPost(){
 let text = document.getElementById("text").value;
 if(text=="") return;

 let post = document.createElement("div");
 post.className="post";
 post.innerHTML = "📝 " + text;

 document.getElementById("posts").prepend(post);
 document.getElementById("text").value="";
}

</script>

</body>
</html>
