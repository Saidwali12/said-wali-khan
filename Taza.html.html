
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تازه خبرونه | سیدولي خان</title>

<style>
*{box-sizing:border-box}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

.back-btn{
display:inline-block;
margin:10px;
background:#ff9800;
color:white;
text-decoration:none;
padding:9px 16px;
border-radius:6px;
font-size:14px;
font-weight:bold;
border:0;
cursor:pointer;
}

.header{
background:#0d47a1;
color:#fff;
padding:15px;
text-align:center;
}

.header h2{
margin:5px 0;
}

.ticker{
background:#ff9800;
color:white;
padding:12px 0;
font-weight:bold;
overflow:hidden;
white-space:nowrap;
direction:ltr;
}


#tickerText{
display:inline-block;
white-space:nowrap;
padding-right:100%;
animation:moveText 35s linear infinite;
}

@keyframes moveText{
0%{transform:translateX(0)}
100%{transform:translateX(100%)}
}


.news{
max-width:1000px;
margin:auto;
padding:15px;
}

.item{
background:white;
padding:15px;
margin-bottom:12px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
border-right:4px solid #0d47a1;
}

.item a{
text-decoration:none;
font-weight:bold;
color:#0d47a1;
line-height:1.9;
}

.item a:hover{
color:#e65100;
}

.source{
font-size:12px;
color:#666;
margin-top:8px;
}

.status{
background:#fff3cd;
color:#664d03;
padding:12px;
border-radius:8px;
margin-bottom:12px;
line-height:1.9;
}

.footer{
text-align:center;
padding:15px;
color:#666;
font-size:12px;
}


/* د نړۍ د تاوېېدونکې ګول نقشې بڼه */
.world-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 12px 28px;background:linear-gradient(180deg,#071a35,#0d47a1);overflow:hidden;text-align:center}
.world-stage h3{color:#f4d58a;margin:0 0 15px;font-size:19px}
.globe{width:clamp(92px,16vw,128px);aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;background-color:#0876b8;background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/51/BlankMap-Equirectangular.svg");background-repeat:repeat-x;background-size:auto 100%;background-position:0 50%;box-shadow:inset -17px -8px 25px #00152dcc,inset 7px 5px 15px #b9efff66,0 0 18px #58c9ff88,0 0 35px #1c91e955;animation:globeFloat 5s ease-in-out infinite,globeSpin 28s linear infinite}
.globe:before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,#00152d99,transparent 35%,#ffffff22 55%,#00152d99);pointer-events:none}
.globe:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 13px 5px #00152d88;pointer-events:none}
.world-caption{color:#dceeff;font-size:13px;margin:10px 0 0}
@keyframes globeSpin{from{background-position:0 50%}to{background-position:100% 50%}}
@keyframes landDrift{from{background-position:0 50%}to{background-position:100% 50%}}
@keyframes globeFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
.item{display:flex;align-items:flex-start;gap:14px}
.item-image{width:clamp(105px,24%,180px);height:118px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#e8eef5}
.item-content{min-width:0;flex:1}
@media(max-width:560px){.item{gap:10px;padding:11px}.item-image{width:104px;height:92px}.item a{font-size:14px}}
@media(prefers-reduced-motion:reduce){.globe,.globe:before,.globe:after{animation:none}}

</style>
</head>

<body>

<button class="back-btn" onclick="history.back()">⬅ شاتګ</button>

<div class="header">
<h2>📰 تازه خبرونه</h2>
<p>د افغانستان او نړۍ  روانی چاری حقیقی خبرونه</p>
</div>

<section class="world-stage" aria-label="تاوېېدونکې نړۍ نقشه">
<h3>🌍 د نړۍ ژوندۍ ګول نقشه</h3>
<div class="globe" role="img" aria-label="د نړۍ متحرکه ګول نقشه"></div>
<div class="world-caption">د افغانستان او نړۍ د خبرونو مرکز</div>
</section>

<div class="ticker">
<span id="tickerText">
📰 تازه خبرونه | 🌍 په نړۍ کې روانې چارې | 📡 حقیقي خبرونه
</span>
</div>

<div class="news" id="news">
<div class="status">د خبرونو سرچینې کتل کېږي، مهرباني وکړئ انتظار وکړئ...</div>
</div>

<div class="footer">
تازه خبرونه — د معلوماتو مرکز
</div>

<script>
const feeds = [
{
name:"بي‌بي‌سي پښتو",
url:"https://feeds.bbci.co.uk/pashto/rss.xml"
},

{
name:"ډویچه ویله نړیوال خبرونه",
url:"https://rss.dw.com/xml/rss-en-all"
},
{
name:"بي‌بي‌سي نړیوال خبرونه",
url:"https://feeds.bbci.co.uk/news/world/rss.xml"
},
{
name:"یورونیوز نړیوال خبرونه",
url:"https://www.euronews.com/rss"
},
{
name:"ملګري ملتونه — جنیوا",
url:"https://www.ungeneva.org/en/news-media/rss"
},
{
name:"بي‌بي‌سي اردو",
url:"https://feeds.bbci.co.uk/urdu/rss.xml"
},
{
name:"TV9",
url:"https://www.tv9hindi.com/feed"
},
{
name:"امریکا غږ ډیوه",
url:"https://www.voadeewanews.com/api/zrqiteeuqm"
},
{
name:"الجزیره نړیوال خبرونه",
url:"https://www.aljazeera.com/xml/rss/all.xml"
}
];

const headlinePrefix =
"📰 تازه خبرونه | 🌍 په نړۍ کې روانې چارې | 📡 حقیقي خبرونه";

function safeText(value){
return String(value || "").replace(/[&<>"']/g,function(ch){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[ch];
});
}

function safeURL(value){
try{
const u=new URL(value);
if(u.protocol==="https:" || u.protocol==="http:"){
return u.href;
}
}catch(e){}
return "";
}

async function getFeed(feed){
const proxyURL="https://proxy.cors.dev/"+feed.url;

const response=await fetch(proxyURL,{
method:"GET",
credentials:"omit"
});

if(!response.ok){
throw new Error("HTTP "+response.status);
}

const xmlText=await response.text();

const xml=new DOMParser().parseFromString(
xmlText,
"application/xml"
);

if(xml.querySelector("parsererror")){
throw new Error("د خبرونو فایل لوستل کېدای نه شي");
}

const nodes=Array.from(xml.querySelectorAll("item, entry"));

const items=nodes.map(node=>{
const titleNode=node.querySelector("title");
const linkNode=node.querySelector("link");

let link="";

if(linkNode){
link=linkNode.getAttribute("href") ||
linkNode.textContent || "";
}

// د RSS له بېلابېلو بڼو څخه د خبر انځور راایستل
let image="";
const mediaNodes=Array.from(node.getElementsByTagName("*"));
const mediaImage=mediaNodes.find(el=>{
 const tag=(el.localName || el.nodeName || "").toLowerCase();
 return tag==="thumbnail" || tag==="content" || tag==="enclosure";
});
if(mediaImage) image=mediaImage.getAttribute("url") || mediaImage.getAttribute("href") || "";
if(!image){
 const htmlNode=mediaNodes.find(el=>{
  const tag=(el.localName || el.nodeName || "").toLowerCase();
  return tag==="encoded" || tag==="description" || tag==="summary";
 });
 if(htmlNode && htmlNode.textContent){
  const parsed=new DOMParser().parseFromString(htmlNode.textContent,"text/html");
  const img=parsed.querySelector("img");
  if(img) image=img.getAttribute("src") || img.getAttribute("data-src") || "";
 }
}
return {
 title:titleNode ? titleNode.textContent.trim() : "",
 link:link.trim(),
 image:image.trim()
};
}).filter(item=>item.title).slice(0,5);

if(!items.length){
throw new Error("خبرونه ونه موندل شول");
}

return {
name:feed.name,
items:items
};
}

async function loadNews(){
const newsBox=document.getElementById("news");
const tickerBox=document.getElementById("tickerText");

newsBox.innerHTML=
'<div class="status">خبرونه تازه کېږي، لږ انتظار وکړئ...</div>';

const results=await Promise.allSettled(
feeds.map(feed=>getFeed(feed))
);

let html="";
let headlines=[];
let errors=[];

results.forEach((result,index)=>{
if(result.status==="fulfilled"){
const feedData=result.value;

feedData.items.forEach(item=>{
headlines.push(item.title);

const link=safeURL(item.link);
const title=safeText(item.title);
const imageURL=safeURL(item.image);
const imageHTML=imageURL
? `<img class="item-image" src="${safeText(imageURL)}" alt="د خبر انځور" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
: "";

html+=`
<div class="item">
${imageHTML}
<div class="item-content">
${link
? `<a href="${safeText(link)}" target="_blank" rel="noopener noreferrer">${title}</a>`
: `<strong>${title}</strong>`
}
<div class="source">${safeText(feedData.name)}</div>
</div>
</div>
`;
});
}else{
errors.push(feeds[index].name);
}
});

if(html){
newsBox.innerHTML=html;

tickerBox.textContent=
headlinePrefix+"  |  "+headlines.join("  |  ");
}else{
newsBox.innerHTML=
'<div class="status">اوس مهال خبرونه ترلاسه نه شول. د انټرنېټ یا د خبرونو د سرچینو اړیکه وګورئ؛ پاڼه به بیا هڅه وکړي.<br>ناکامې سرچینې: '+
safeText(errors.join("، "))+
'</div>';

tickerBox.textContent=headlinePrefix;
}
}

loadNews();

setInterval(loadNews,60*60*1000);
</script>
