name: Cloudflare production operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose exactly one production operation"
        required: true
        type: choice
        options:
          - preflight
          - worker-deploy
          - d1-sql
      confirm_production:
        description: "Type I_APPROVE_PRODUCTION_CHANGE to authorize this run"
        required: false
        type: string
      worker_name:
        description: "Existing Worker to deploy (worker-deploy only)"
        required: false
        type: choice
        options:
          - afghanistan-jobs-api
          - saidwali-cloudflare-manager
          - saidwali-cloudflare-mcp
          - saidwali-cricket
          - saidwali-games-api
          - saidwali-gpt
          - saidwali-help-center
          - saidwali-jobs-api
          - saidwali-social-api
          - saidwali-whatsapp-api
          - saidwali-whatsapp-server
      worker_config:
        description: "Path to that Worker's reviewed wrangler.toml in this repository"
        required: false
        type: string
        default: "wrangler.toml"
      worker_config_sha256:
        description: "Expected SHA-256 of the reviewed Wrangler config (64 hex characters)"
        required: false
        type: string
      worker_entrypoint_sha256:
        description: "Expected SHA-256 of the Worker main entrypoint (64 hex characters)"
        required: false
        type: string
      database:
        description: "D1 database to update (d1-sql only)"
        required: false
        type: choice
        options:
          - saidwali-jobs-db
          - saidwali-whatsapp-db
          - saidwali-games-db
          - saidwali-help-db
          - saidwali-social-db
      sql_file:
        description: "Checked-in SQL file under .github/cloudflare-sql/"
        required: false
        type: string
      sql_sha256:
        description: "Expected SHA-256 of the reviewed SQL file (64 hex characters)"
        required: false
        type: string
      confirm_sql_execution:
        description: "Required for every remote SQL execution: I_APPROVE_SQL_EXECUTION"
        required: false
        type: string
      confirm_database_change:
        description: "Required for every remote D1 change: I_APPROVE_REMOTE_D1_CHANGE"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-operations
  cancel-in-progress: false

jobs:
  production-operation:
    name: Manually approved Cloudflare production operation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out the approved main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate approval and credentials
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          APPROVAL: ${{ inputs.confirm_production }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" != "preflight" ]]; then
            [[ "$APPROVAL" == "I_APPROVE_PRODUCTION_CHANGE" ]] || {
              echo "::error::Production confirmation text does not match."
              exit 1
            }
          fi
          [[ -n "$CF_API_TOKEN" ]] || {
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN_WRITE is missing."
            exit 1
          }
          [[ "$CF_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or invalid."
            exit 1
          }
          [[ "$OPERATION" == "preflight" || "$OPERATION" == "worker-deploy" || "$OPERATION" == "d1-sql" ]] || {
            echo "::error::Unsupported operation."
            exit 1
          }
          echo "Approval and required configuration validated. Secret values are not displayed."

      - name: Set up Node.js
        if: inputs.operation == 'preflight' || inputs.operation == 'worker-deploy' || inputs.operation == 'd1-sql'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token without changing production resources
        if: inputs.operation == 'preflight'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const token = process.env.CF_API_TOKEN;
            if (!token) {
              console.error("Cloudflare token verification: unavailable");
              process.exit(1);
            }
            const response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000)
            });
            let data;
            try {
              data = await response.json();
            } catch {
              console.error("Cloudflare token verification: failed (invalid response)");
              process.exit(1);
            }
            if (!response.ok || data?.success !== true || data?.result?.status !== "active") {
              console.error("Cloudflare token verification: failed or token is not active");
              process.exit(1);
            }
            console.log("Cloudflare Write API token: ACTIVE");
            console.log("Preflight complete. No Worker or D1 resources were modified.");
          })().catch(() => {
            console.error("Cloudflare token verification: failed");
            process.exit(1);
          });
          NODE

      - name: Deploy one existing Worker
        if: inputs.operation == 'worker-deploy'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ inputs.worker_name }}
          WORKER_CONFIG: ${{ inputs.worker_config }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.worker_config_sha256 }}
          EXPECTED_ENTRYPOINT_SHA256: ${{ inputs.worker_entrypoint_sha256 }}
        run: |
          set -euo pipefail
          case "$WORKER_NAME" in
            afghanistan-jobs-api|saidwali-cloudflare-manager|saidwali-cloudflare-mcp|saidwali-cricket|saidwali-games-api|saidwali-gpt|saidwali-help-center|saidwali-jobs-api|saidwali-social-api|saidwali-whatsapp-api|saidwali-whatsapp-server) ;;
            *) echo "::error::Worker is not in the approved existing-Worker list."; exit 1 ;;
          esac
          [[ "$WORKER_CONFIG" == *.toml && "$WORKER_CONFIG" != /* && "$WORKER_CONFIG" != *".."* ]] || {
            echo "::error::Only a repository-local wrangler.toml config path is allowed."
            exit 1
          }
          [[ "$EXPECTED_CONFIG_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || {
            echo "::error::A valid expected config SHA-256 is required."
            exit 1
          }
          [[ "$EXPECTED_ENTRYPOINT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || {
            echo "::error::A valid expected Worker entrypoint SHA-256 is required."
            exit 1
          }
          workspace="$(realpath -e .)"
          config_real="$(realpath -e -- "$WORKER_CONFIG")"
          [[ "$config_real" == "$workspace/"* && -f "$config_real" && ! -L "$WORKER_CONFIG" ]] || {
            echo "::error::Worker config must be a regular file inside this repository, not a symlink."
            exit 1
          }
          actual_config_sha="$(sha256sum "$config_real" | cut -d ' ' -f 1)"
          [[ "${actual_config_sha,,}" == "${EXPECTED_CONFIG_SHA256,,}" ]] || {
            echo "::error::Worker config SHA-256 does not match the reviewed value."
            exit 1
          }
          python - "$config_real" "$WORKER_NAME" "$workspace" "$EXPECTED_ENTRYPOINT_SHA256" <<'PY'
          import hashlib, pathlib, sys, tomllib
          path = pathlib.Path(sys.argv[1])
          expected_name, workspace, expected_hash = sys.argv[2:]
          config = tomllib.loads(path.read_text(encoding="utf-8"))
          if config.get("name") != expected_name:
              raise SystemExit("Worker config name does not match the selected Worker; refusing deployment.")
          main = config.get("main")
          if not isinstance(main, str) or not main or pathlib.PurePosixPath(main).is_absolute() or ".." in pathlib.PurePosixPath(main).parts:
              raise SystemExit("Wrangler config must declare a safe repository-relative main entrypoint.")
          root = pathlib.Path(workspace).resolve()
          entry_candidate = path.parent / main
          if entry_candidate.is_symlink():
              raise SystemExit("Worker main entrypoint must not be a symlink.")
          entry = entry_candidate.resolve(strict=True)
          if root not in entry.parents or not entry.is_file():
              raise SystemExit("Worker main entrypoint must be a regular file inside this repository.")
          actual = hashlib.sha256(entry.read_bytes()).hexdigest()
          if actual.lower() != expected_hash.lower():
              raise SystemExit("Worker entrypoint SHA-256 does not match the reviewed value.")
          PY
          echo "Deploying only the explicitly selected Worker after config and entrypoint hash verification: $WORKER_NAME"
          npx --yes wrangler@4.45.0 deploy --config "$config_real"

      - name: Execute one reviewed D1 SQL file remotely
        if: inputs.operation == 'd1-sql'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ inputs.database }}
          SQL_FILE: ${{ inputs.sql_file }}
          EXPECTED_SQL_SHA256: ${{ inputs.sql_sha256 }}
          SQL_APPROVAL: ${{ inputs.confirm_sql_execution }}
          DATABASE_APPROVAL: ${{ inputs.confirm_database_change }}
        run: |
          set -euo pipefail
          case "$DATABASE" in
            saidwali-jobs-db|saidwali-whatsapp-db|saidwali-games-db|saidwali-help-db|saidwali-social-db) ;;
            *) echo "::error::D1 database is not in the approved database list."; exit 1 ;;
          esac
          [[ "$SQL_FILE" == .github/cloudflare-sql/*.sql && "$SQL_FILE" != *".."* ]] || {
            echo "::error::SQL file must be a .sql file inside .github/cloudflare-sql/."
            exit 1
          }
          [[ "$SQL_APPROVAL" == "I_APPROVE_SQL_EXECUTION" ]] || {
            echo "::error::Every remote SQL execution requires the explicit SQL approval phrase."
            exit 1
          }
          [[ "$DATABASE_APPROVAL" == "I_APPROVE_REMOTE_D1_CHANGE" ]] || {
            echo "::error::Every remote D1 change requires the separate database-change approval phrase."
            exit 1
          }
          [[ "$EXPECTED_SQL_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || {
            echo "::error::A valid expected SQL SHA-256 is required."
            exit 1
          }
          workspace="$(realpath -e .)"
          sql_real="$(realpath -e -- "$SQL_FILE")"
          [[ "$sql_real" == "$workspace/.github/cloudflare-sql/"* && -f "$sql_real" && ! -L "$SQL_FILE" ]] || {
            echo "::error::SQL must resolve to a regular non-symlink file inside .github/cloudflare-sql/."
            exit 1
          }
          actual_sql_sha="$(sha256sum "$sql_real" | cut -d ' ' -f 1)"
          [[ "${actual_sql_sha,,}" == "${EXPECTED_SQL_SHA256,,}" ]] || {
            echo "::error::SQL file SHA-256 does not match the reviewed value."
            exit 1
          }
          echo "Executing the hash-verified SQL file against the selected remote D1 database. SQL contents are not printed."
          npx --yes wrangler@4.45.0 d1 execute "$DATABASE" --remote --file "$sql_real"

      - name: Record safe completion summary
        if: success()
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          WORKER_NAME: ${{ inputs.worker_name }}
          DATABASE: ${{ inputs.database }}
        run: |
          {
            echo "## Cloudflare production operation"
            echo
            printf '%s\n' "- Operation: $OPERATION"
            if [[ "$OPERATION" == "worker-deploy" ]]; then
              printf '%s\n' "- Selected Worker: $WORKER_NAME"
            elif [[ "$OPERATION" == "d1-sql" ]]; then
              printf '%s\n' "- Selected D1 database: $DATABASE"
            else
              printf '%s\n' "- Production resource changes: none (preflight only)"
            fi
            echo "- Secret values and SQL contents: not included"
            echo "- No source-code artifacts were created"
          } >> "$GITHUB_STEP_SUMMARY"
