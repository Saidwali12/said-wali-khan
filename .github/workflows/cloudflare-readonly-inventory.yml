name: Cloudflare read-only inventory

on:
  workflow_dispatch:
    inputs:
      inventory:
        description: "Choose which Cloudflare resources to list"
        required: true
        type: choice
        options:
          - all
          - workers
          - d1
          - pages

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Read Cloudflare inventory only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_API_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "${CF_ACCOUNT_ID}" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          if [[ ! "${CF_ACCOUNT_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal Account ID."
            exit 1
          fi

      - name: Read selected resources
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          INVENTORY: ${{ inputs.inventory }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          summary="${RUNNER_TEMP}/cloudflare-inventory.md"
          : > "${summary}"
          {
            echo "# Cloudflare read-only inventory"
            echo
            echo "- Selection: `${INVENTORY}`"
            echo "- Account: configured GitHub variable (value hidden)"
            echo "- Mode: read-only; no resources are modified"
            echo
          } >> "${summary}"
          trap 'status=$?; if [[ "$status" -eq 0 ]]; then printf "\n**Result: SUCCESS**\n" >> "$summary"; else printf "\n**Result: FAILED (exit code %s)**\n" "$status" >> "$summary"; fi; cat "$summary" >> "$GITHUB_STEP_SUMMARY"' EXIT

          fetch_and_summarize() {
            local label="$1"
            local endpoint="$2"
            local jq_filter="$3"
            local response
            response="$(mktemp)"
            local http_code
            http_code="$(curl --silent --show-error --output "${response}" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "${base}${endpoint}")"
            if [[ "${http_code}" != "200" ]]; then
              echo "::error::Cloudflare API request for ${label} failed (HTTP ${http_code}). Check read-only token permissions."
              printf "\n### %s — FAILED (HTTP %s)\n" "$label" "$http_code" >> "${summary}"
              rm -f "${response}"
              exit 1
            fi
            if [[ "$(jq -r '.success // false' "${response}")" != "true" ]]; then
              echo "::error::Cloudflare returned an unsuccessful response for ${label}."
              printf "\n### %s — Cloudflare API error\n" "$label" >> "${summary}"
              jq -r '.errors[]? | "- Code " + (.code | tostring) + ": " + (.message // "No message")' "${response}" | head -10 | tee -a "${summary}"
              rm -f "${response}"
              exit 1
            fi
            {
              echo "## ${label}"
              jq -r "${jq_filter}" "${response}"
              echo
            } >> "${summary}"
            rm -f "${response}"
          }

          show_cloudflare_error_details() {
            local response_file="$1"
            local details
            details="$(jq -r '
              if (.errors | type) == "array" and (.errors | length) > 0 then
                .errors[] | "Cloudflare error code: " + (.code | tostring) + " — " + (.message // "No message")
              else
                empty
              end
            ' "$response_file" 2>/dev/null || true)"
            if [[ -n "$details" ]]; then
              printf '%s\n' "$details"
            else
              echo "Cloudflare did not return structured error details. Check the Account ID and Pages Read token scope."
            fi
          }

          fetch_pages_projects() {
            local response headers
            response="$(mktemp)"
            headers="$(mktemp)"
            {
              echo "## Pages projects (read-only)"
              echo
            } >> "${summary}"

            local http_code
            http_code="$(curl --silent --show-error --output "${response}" --dump-header "${headers}" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "${base}/pages/projects")"
            if [[ "${http_code}" != "200" ]]; then
              echo "::error::Cloudflare Pages inventory request failed (HTTP ${http_code})."
              printf "\n### Pages projects — FAILED (HTTP %s)\n" "$http_code" >> "${summary}"
              echo "Pages API route: GET /client/v4/accounts/{account_id}/pages/projects"
              echo "Response content type:"
              awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { sub(/\\r$/, ""); print; exit }' "${headers}" || true
              echo "Cloudflare Ray ID:"
              awk 'BEGIN { IGNORECASE=1 } /^cf-ray:/ { sub(/\\r$/, ""); print; exit }' "${headers}" || true
              echo "Safe response details (limited fields only):"
              jq -c '{
                success: .success,
                errors: ([.errors[]? | {
                  code: .code,
                  message: .message,
                  source_pointer: (.source.pointer // null)
                }] | .[:10]),
                messages: ([.messages[]? | if type == "object" then {code: .code, message: .message} else tostring end] | .[:10]),
                result_info: .result_info
              }' "${response}" 2>/dev/null | tee -a "${summary}" || echo "Response body was not valid JSON." | tee -a "${summary}"
              rm -f "${response}" "${headers}"
              exit 1
            fi
            rm -f "${headers}"
            if [[ "$(jq -r '.success // false' "${response}")" != "true" ]]; then
              echo "::error::Cloudflare returned an unsuccessful Pages response."
              printf "\n### Pages projects — unsuccessful Cloudflare response\n" >> "${summary}"
              show_cloudflare_error_details "${response}" | tee -a "${summary}"
              rm -f "${response}"
              exit 1
            fi

            local total_projects
            total_projects="$(jq -r '.result | length' "${response}")"
            jq -r '.result[]? | "- " + (.name // .id // "Unnamed project")' "${response}" >> "${summary}"
            if (( total_projects == 0 )); then
              echo "- Cloudflare returned zero Pages projects for this account." >> "${summary}"
            fi
            {
              echo
              echo "Pages projects returned: ${total_projects}"
              echo "Pages API pagination: endpoint defaults (single request)"
              echo
            } >> "${summary}"
            rm -f "${response}"
          }

          case "${INVENTORY}" in
            all|workers)
              fetch_and_summarize "Workers (read-only)" "/workers/scripts" '.result[]? | "- " + .id'
              ;;
          esac
          case "${INVENTORY}" in
            all|d1)
              fetch_and_summarize "D1 databases (read-only)" "/d1/database" '.result[]? | "- " + .name + " (" + .uuid + ")"'
              ;;
          esac
          case "${INVENTORY}" in
            all|pages)
              fetch_pages_projects
              ;;
          esac

          echo "Read-only inventory completed. No Worker deploy, D1 SQL, or resource changes were requested."
