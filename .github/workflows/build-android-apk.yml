name: Build Saidwali Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Capacitor Android wrapper
        shell: bash
        run: |
          mkdir -p www
          printf '%s\\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Loading Saidwali website...</body></html>' > www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.saidwali.khan",
            "appName": "Said Wali Khan",
            "webDir": "www",
            "server": {
              "url": "https://saidwali12.github.io/said-wali-khan/",
              "cleartext": false,
              "allowNavigation": [
                "saidwali12.github.io",
                "*.workers.dev"
              ]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Fix duplicate Kotlin standard libraries
        shell: bash
        run: |
          cat > android/kotlin-resolution.init.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                    (details.requested.name == 'kotlin-stdlib-jdk7' ||
                     details.requested.name == 'kotlin-stdlib-jdk8')) {
                  details.useTarget('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                  details.because('Avoid duplicate Kotlin standard library classes')
                }
              }
            }
          }
          EOF

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --init-script kotlin-resolution.init.gradle assembleDebug

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Saidwali Android APK
          body: Latest installable Saidwali Android application.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saidwali-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
