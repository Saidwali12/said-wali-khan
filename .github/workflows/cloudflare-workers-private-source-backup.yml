name: Secure backup of deployed Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-private-source-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Read deployed source and save only to private audit repository
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out private audit repository
        uses: actions/checkout@v4
        with:
          repository: Saidwali12/saidwali-workers-private-audit
          ref: main
          token: ${{ secrets.PRIVATE_AUDIT_REPO_TOKEN }}
          path: private-audit
          persist-credentials: true

      - name: Validate required credentials without displaying them
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_AUDIT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CF_API_TOKEN" ]] || { echo "::error::Cloudflare read-only token is missing."; exit 1; }
          [[ -n "$PRIVATE_REPO_TOKEN" ]] || { echo "::error::Private repository token is missing."; exit 1; }
          [[ "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::Cloudflare Account ID is missing or invalid."; exit 1; }
          [[ -d private-audit/.git ]] || { echo "::error::Private audit repository checkout failed."; exit 1; }
          echo "Required credentials and private repository access are present."

      - name: Retrieve and correctly unpack deployed Worker source
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          names=(
            afghanistan-jobs-api
            saidwali-cloudflare-manager
            saidwali-cloudflare-mcp
            saidwali-cricket
            saidwali-games-api
            saidwali-gpt
            saidwali-help-center
            saidwali-jobs-api
            saidwali-social-api
            saidwali-whatsapp-api
            saidwali-whatsapp-server
          )
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          out="private-audit/deployed-workers"
          mkdir -p "$out"
          rm -f "$out/SHA256SUMS"

          for name in "${names[@]}"; do
            worker_dir="$out/$name"
            mkdir -p "$worker_dir"
            tmp="$(mktemp -d)"
            code="$(curl --silent --show-error --location \
              --dump-header "$tmp/headers" --output "$tmp/body" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CF_API_TOKEN" \
              --header "Accept: application/javascript" \
              "$base/workers/scripts/$name/content/v2")"

            if [[ "$code" != "200" || ! -s "$tmp/body" ]]; then
              rm -rf "$tmp"
              echo "::error::Could not retrieve source for $name (HTTP $code). Response body was not printed."
              echo "::error::Check that the Cloudflare token has read access to Worker script content."
              exit 1
            fi

            python3 - "$tmp/headers" "$tmp/body" "$worker_dir" "$name" <<'PY'
          import os
          import re
          import sys
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path

          headers_path, body_path, output_dir, worker_name = sys.argv[1:]
          headers = Path(headers_path).read_bytes()
          body = Path(body_path).read_bytes()
          content_types = re.findall(rb"(?im)^content-type:\\s*([^\\r\\n]+)", headers)
          if not content_types:
              raise SystemExit(f"No Content-Type header returned for {worker_name}")
          content_type = content_types[-1].decode("ascii", "strict").strip()
          message_bytes = (
              b"MIME-Version: 1.0\\r\\nContent-Type: "
              + content_type.encode("ascii")
              + b"\\r\\n\\r\\n"
              + body
          )
          message = BytesParser(policy=policy.default).parsebytes(message_bytes)
          target = Path(output_dir).resolve()
          written = []

          if message.is_multipart():
              for part in message.iter_parts():
                  filename = part.get_filename()
                  payload = part.get_payload(decode=True)
                  if not filename or payload is None:
                      continue
                  safe_name = Path(filename.replace("\\\\", "/")).name
                  if safe_name in ("", ".", ".."):
                      continue
                  destination = (target / safe_name).resolve()
                  if destination.parent != target:
                      raise SystemExit(f"Unsafe source filename returned for {worker_name}")
                  destination.write_bytes(payload)
                  written.append(safe_name)
          elif content_type.lower().startswith(("application/javascript", "text/javascript")):
              (target / "worker.js").write_bytes(body)
              written.append("worker.js")
          else:
              raise SystemExit(f"Unexpected response content type for {worker_name}: {content_type}")

          if "worker.js" not in written:
              raise SystemExit(f"Main worker.js file was not found in Cloudflare response for {worker_name}")
          print(f"Unpacked {len(written)} source file(s) for {worker_name}; source text is not displayed.")
          PY
            rm -rf "$tmp"
            (
              cd "$worker_dir"
              find . -type f -print0 | sort -z | while IFS= read -r -d '' file; do
                sha256sum "$file"
              done
            ) | sed "s#  ./#  $name/#" >> "$out/SHA256SUMS"
            echo "Source bundle retrieved and checksummed for $name; source content is not displayed."
          done

          cat > "$out/README.md" <<'EOF'
          # Deployed Cloudflare Worker source backup

          These files were retrieved from the active Cloudflare account through read-only
          Workers Scripts Content API requests. Multipart responses are unpacked into their
          individual named source files. This is a point-in-time backup, not proof of security.

          - No Worker was edited, uploaded, deployed, or deleted.
          - No D1 database, binding, variable, or secret was changed.
          - Source contents are intentionally not printed in Actions logs.
          - SHA-256 checksums for saved files are recorded in SHA256SUMS.
          - Review this backup for hard-coded credentials before sharing or exporting it.
          EOF

      - name: Commit source backup to the private repository
        shell: bash
        working-directory: private-audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployed-workers/
          if git diff --cached --quiet; then
            echo "No source changes detected; private backup is already current."
            exit 0
          fi
          git commit -m "Back up deployed Cloudflare Worker source (read-only)"
          git push origin HEAD:main
          echo "Deployed source backup committed to the private audit repository."
