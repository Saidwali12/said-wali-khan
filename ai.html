<style>
body{
font-family:Tahoma;
background:#eef3fb;
margin:0;
}

/* HEADER */
header{
background:linear-gradient(90deg,#0d47a1,#1976d2);
color:white;
text-align:center;
padding:25px;
}

/* BACK BUTTON */
.back-btn{
position:fixed;
top:15px;
right:15px;
background:#ff9800;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-size:14px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
z-index:999;
}

.back-btn:hover{
background:#e68900;
}

/* CONTAINER */
.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
padding:20px;
}

/* CARD */
.card{
background:white;
width:240px;
padding:15px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

/* IMAGE */
.card img{
width:55px;
height:55px;
object-fit:contain;
padding:6px;
background:#fff;
border-radius:10px;
border:1px solid #e0e0e0;
display:block;
margin:0 auto 10px auto;
}

.card h3{
margin:8px 0;
font-size:16px;
}

.card a{
display:inline-block;
margin-top:10px;
background:#ff9800;
color:white;
padding:8px 14px;
text-decoration:none;
border-radius:6px;
font-size:14px;
}

footer{
background:#0d47a1;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>
</head>
